# Replace your existing entities: entries with these, or copy only markers:
entities:
  - entity: sensor.keuken_temperature
    name: Kitchen
    markers:
      - at:
          entity: sensor.sbcp_kitchen_historical_max
        lane: above
        shape: triangle
        direction: inward
        color: "#8b7cff"
        label:
          show: true
          text: Max
          show_value: true
          show_unit: true
          precision: 1
      - at:
          entity: sensor.sbcp_kitchen_historical_min
        lane: below
        shape: triangle
        direction: inward
        color: "#55c7f3"
        label:
          show: true
          text: Min
          show_value: true
          show_unit: true
          precision: 1
