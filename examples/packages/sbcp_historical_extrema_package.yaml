# ---------------------------------------------------------------------------
# Shared dynamic scale for the Home Temperatures SBCP card
#
# Default scale: 15 .. 25 °C
#
# Upper boundary:
# - Historical peak above 23 °C -> ceil(peak + 3)
# - Current value above 23 °C   -> ceil(value + 5)
# - Highest resulting boundary wins
#
# Lower boundary:
# - Historical floor below 15 °C -> floor(floor - 1)
# - Current value below 17 °C     -> floor(value - 5)
# - Lowest resulting boundary wins
#
# All rooms therefore use exactly the same scale.
# ---------------------------------------------------------------------------

      - name: "SBCP Home Temperature Scale Max"
        unique_id: sbcp_home_temperature_scale_max
        unit_of_measurement: "°C"
        state: >-
          {% set peaks = [
            states('sensor.sbcp_kitchen_historical_max'),
            states('sensor.sbcp_office_downstairs_historical_max'),
            states('sensor.sbcp_storage_room_historical_max'),
            states('sensor.sbcp_hallway_upstairs_historical_max'),
            states('sensor.sbcp_attic_historical_max'),
            states('sensor.sbcp_garage_historical_max')
          ] | select('is_number') | map('float') | list %}
  
          {% set values = [
            states('sensor.keuken_temperature'),
            states('sensor.bureau_temperature'),
            states('sensor.berging_temperature'),
            states('sensor.nachthal_boven_temperature'),
            states('sensor.zolder_onder_cv_temperature'),
            states('sensor.garage_onder_pomp_temperature')
          ] | select('is_number') | map('float') | list %}
  
          {% set peak = peaks | max if peaks else none %}
          {% set value = values | max if values else none %}
  
          {% set candidates = [25] %}
  
          {% if peak is not none and peak > 23 %}
            {% set candidates = candidates + [(peak + 3) | round(0, 'ceil')] %}
          {% endif %}
  
          {% if value is not none and value > 23 %}
            {% set candidates = candidates + [(value + 5) | round(0, 'ceil')] %}
          {% endif %}
  
          {{ candidates | max | int }}
  
      - name: "SBCP Home Temperature Scale Min"
        unique_id: sbcp_home_temperature_scale_min
        unit_of_measurement: "°C"
        state: >-
          {% set floors = [
            states('sensor.sbcp_kitchen_historical_min'),
            states('sensor.sbcp_office_downstairs_historical_min'),
            states('sensor.sbcp_storage_room_historical_min'),
            states('sensor.sbcp_hallway_upstairs_historical_min'),
            states('sensor.sbcp_attic_historical_min'),
            states('sensor.sbcp_garage_historical_min')
          ] | select('is_number') | map('float') | list %}
  
          {% set values = [
            states('sensor.keuken_temperature'),
            states('sensor.bureau_temperature'),
            states('sensor.berging_temperature'),
            states('sensor.nachthal_boven_temperature'),
            states('sensor.zolder_onder_cv_temperature'),
            states('sensor.garage_onder_pomp_temperature')
          ] | select('is_number') | map('float') | list %}
  
          {% set floor = floors | min if floors else none %}
          {% set value = values | min if values else none %}
  
          {% set candidates = [15] %}
  
          {% if floor is not none and floor < 15 %}
            {% set candidates = candidates + [(floor - 1) | round(0, 'floor')] %}
          {% endif %}
  
          {% if value is not none and value < 17 %}
            {% set candidates = candidates + [(value - 5) | round(0, 'floor')] %}
          {% endif %}
  
          {{ candidates | min | int }}
