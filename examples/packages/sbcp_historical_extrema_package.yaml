# Reusable historical extrema for Sensor Bar Card Plus.
# Requires Recorder statistics on source sensors (state_class: measurement).
# All six rooms share one period selector. Update every 5 minutes.
# 5-minute stats for <= 7 days; hourly stats for longer periods.
# Long-term hourly stats are approximate for absolute extrema.
# See companion README for limitations and instructions.
input_select:
  sbcp_extrema_period:
    name: SBCP extrema period
    options:
      - "Today"
      - "Yesterday"
      - "This week"
      - "This month"
      - "This year"
      - "Last hour"
      - "Last 12 hours"
      - "Last 24 hours"
      - "Last 7 days"
      - "Last 30 days"
    icon: mdi:calendar-clock

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: input_select.sbcp_extrema_period
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          selected_period: "{{ states('input_select.sbcp_extrema_period') }}"
          window_start: >-
            {% set p = selected_period %}
            {% set t = now() %}
            {% set midnight = today_at() %}
            {% if p == "Yesterday" %}{{ (midnight - timedelta(days=1)).isoformat() }}
            {% elif p == "This week" %}{{ (midnight - timedelta(days=t.weekday())).isoformat() }}
            {% elif p == "This month" %}{{ midnight.replace(day=1).isoformat() }}
            {% elif p == "This year" %}{{ midnight.replace(month=1, day=1).isoformat() }}
            {% elif p == "Last hour" %}{{ (t - timedelta(hours=1)).isoformat() }}
            {% elif p == "Last 12 hours" %}{{ (t - timedelta(hours=12)).isoformat() }}
            {% elif p == "Last 24 hours" %}{{ (t - timedelta(hours=24)).isoformat() }}
            {% elif p == "Last 7 days" %}{{ (t - timedelta(days=7)).isoformat() }}
            {% elif p == "Last 30 days" %}{{ (t - timedelta(days=30)).isoformat() }}
            {% else %}{{ midnight.isoformat() }}{% endif %}
          window_end: >-
            {% if selected_period == "Yesterday" %}{{ today_at().isoformat() }}
            {% else %}{{ now().isoformat() }}{% endif %}
          stats_granularity: >-
            {% if (as_timestamp(window_end) - as_timestamp(window_start)) > 9 * 86400 %}hour
            {% else %}5minute{% endif %}
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.keuken_temperature
            - sensor.bureau_temperature
            - sensor.berging_temperature
            - sensor.nachthal_boven_temperature
            - sensor.zolder_onder_cv_temperature
            - sensor.garage_onder_pomp_temperature
          start_time: "{{ window_start }}"
          end_time: "{{ window_end }}"
          period: "{{ stats_granularity }}"
          types:
            - min
            - max
        response_variable: extrema_stats
    sensor:
      - name: "SBCP Kitchen Historical Minimum"
        unique_id: sbcp_kitchen_historical_min
        default_entity_id: sensor.sbcp_kitchen_historical_min
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (extrema_stats is defined and (extrema_stats.get("statistics", {}).get("sensor.keuken_temperature", []) | count > 0 or (selected_period != "Yesterday" and is_number(states("sensor.keuken_temperature"))))) }}
        state: >-
          {% set source = "sensor.keuken_temperature" %}
          {% set values = extrema_stats.get("statistics", {}).get(source, []) | map(attribute="min") | select("number") | list %}
          {% if selected_period != "Yesterday" and is_number(states(source)) %}
            {% set values = values + [states(source) | float] %}
          {% endif %}
          {{ (values | min) if values else "unknown" }}
      - name: "SBCP Kitchen Historical Maximum"
        unique_id: sbcp_kitchen_historical_max
        default_entity_id: sensor.sbcp_kitchen_historical_max
        unit_of_measurement: "°C"
