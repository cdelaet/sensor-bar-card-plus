          {% set values = extrema_stats.get("statistics", {}).get(source, []) | map(attribute="max") | select("number") | list %}
          {% if selected_period != "Yesterday" and is_number(states(source)) %}
            {% set values = values + [states(source) | float] %}
          {% endif %}
          {{ (values | max) if values else "unknown" }}
      - name: "SBCP Office Downstairs Historical Minimum"
