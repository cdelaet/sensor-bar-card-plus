  sbcp_showcase_phase:
    name: SBCP Showcase Phase
    min: 0
    max: 359
    step: 1
    mode: box
    initial: 0

  sbcp_hero_phase:
    name: SBCP Hero Simulation Time
    min: 0
    max: 86399
    step: 0.1
    mode: box
    initial: 0

  sbcp_hero_simulation_speed:
    name: SBCP Hero Simulation Speed
    min: 60
    max: 21600
    step: 60
    mode: box
    initial: 3600
    unit_of_measurement: s/h

  sbcp_docs_story_position:
    name: SBCP Documentation Story Position
    min: 0
    max: 8
    step: 0.01
    mode: slider
    initial: 3

  sbcp_docs_phase_hold:
    name: SBCP Documentation Phase Hold
    min: 0
    max: 3
    step: 0.25
    mode: slider
    initial: 0.25
    unit_of_measurement: s

  sbcp_docs_night_hold:
    name: SBCP Documentation Night Hold
    min: 1
    max: 8
    step: 0.5
    mode: slider
    initial: 3
    unit_of_measurement: s

  sbcp_docs_static_hero_solar:
    name: SBCP Static Hero Solar
    min: 0
    max: 7000
    step: 100
    mode: box
    initial: 5500
    unit_of_measurement: W

  sbcp_docs_static_hero_solar_forecast:
    name: SBCP Static Hero Solar Forecast
    min: 0
    max: 7000
    step: 100
    mode: box
    initial: 5900
    unit_of_measurement: W

  sbcp_docs_static_hero_home_load:
    name: SBCP Static Hero Home Load
    min: 0
    max: 5000
    step: 100
    mode: box
    initial: 2300
    unit_of_measurement: W

  sbcp_docs_static_hero_ev_charge:
    name: SBCP Static Hero EV Charge
    min: 0
    max: 5000
    step: 100
    mode: box
    initial: 3600
    unit_of_measurement: W

  sbcp_docs_static_hero_ev_soc:
    name: SBCP Static Hero EV State of Charge
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 67
    unit_of_measurement: '%'

  sbcp_docs_static_hero_battery_power:
    name: SBCP Static Hero Desired Battery Power
    min: -2500
    max: 2500
    step: 50
    mode: box
    initial: -1000
    unit_of_measurement: W

  sbcp_docs_static_hero_battery_power_driven:
    name: SBCP Static Hero Driven Battery Power
    min: -2500
    max: 2500
    step: 50
    mode: box
    initial: -1000
    unit_of_measurement: W

  sbcp_docs_static_hero_battery_reserve:
    name: SBCP Static Hero Battery Reserve
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 65
    unit_of_measurement: '%'

  sbcp_docs_static_hero_peak_setup:
    name: SBCP Static Hero Peak Setup
    min: 0
    max: 2500
    step: 50
    mode: box
    initial: 1800
    unit_of_measurement: W

  sbcp_docs_static_hero_floor_setup:
    name: SBCP Static Hero Floor Setup
    min: -2500
    max: 0
    step: 50
    mode: box
    initial: -1200
    unit_of_measurement: W

input_boolean:
  sbcp_examples_sweep_enabled:
    name: Visual Examples · GIF Sweep
    icon: mdi:play-pause
    initial: false

  # Internal direction memory for the Visual Examples triangle wave.
  sbcp_examples_sweep_up:
    name: Visual Examples · Sweep Rising
    initial: true

  sbcp_animated:
    name: SBCP Animated
    initial: true

  sbcp_target_enabled:
    name: SBCP Target Enabled
    initial: true

  sbcp_above_target_enabled:
    name: SBCP Above Target Enabled
    initial: true

  sbcp_show_target_label:
    name: SBCP Show Target Label
    initial: true

  sbcp_show_peak:
    name: SBCP Show Peak
    initial: true

  sbcp_wave_enabled:
    name: SBCP Wave Enabled
    initial: false

  sbcp_showcase_enabled:
    name: SBCP Showcase Enabled
    initial: true

  sbcp_hero_showcase_enabled:
    name: SBCP Hero Showcase Enabled
    initial: true

  sbcp_hero_simulation_enabled:
    name: SBCP Hero Simulation Enabled
    initial: true

  sbcp_docs_animation_running:
    name: SBCP Documentation Animation Running
    initial: false

  # Internal source selection; the dashboard exposes only the capture button.
  sbcp_docs_hero_capture_active:
    name: SBCP Hero Capture Active
    initial: false

input_button:
  sbcp_docs_hero_capture:
    name: Set showcase capture state
    icon: mdi:camera
  sbcp_docs_animation_run:
    name: Play energy story
    icon: mdi:play
  sbcp_docs_animation_stop:
    name: Pause energy story
    icon: mdi:pause
  sbcp_docs_animation_step_back:
    name: Previous energy phase
    icon: mdi:skip-previous
  sbcp_docs_animation_step_forward:
    name: Next energy phase
    icon: mdi:skip-next
  sbcp_docs_animation_seek:
    name: Jump to selected energy phase
    icon: mdi:cursor-default-click

input_select:
  sbcp_marker_label_mode:
    name: SBCP Marker Label Operating Mode
    options:
      - Eco
      - Normal
      - Boost
      - Smart
    initial: Eco

  sbcp_marker_label_relay:
    name: SBCP Marker Label Relay State
    options:
      - "On"
      - "Off"
    initial: "On"

  sbcp_color_mode:
    name: SBCP Color Mode
    options:
      - gradient
      - severity
      - severity_gradient
      - single
    initial: gradient

  sbcp_label_mode:
    name: SBCP Label Mode
    options:
      - left
      - above
      - inside
      - "off"
    initial: left

  sbcp_docs_energy_phase:
    name: SBCP Documentation Energy Story
    options:
      - Dawn
      - Morning ramp
      - Solar surplus
      - Battery charge
      - Peak sun
      - EV plugged in
      - Cloud passing
      - Evening import
      - Night
    initial: Battery charge

  sbcp_waveform:
    name: SBCP Waveform
    options:
      - sine
      - triangle
      - random
    initial: sine

  sbcp_docs_animation_speed:
    name: SBCP Documentation Animation Speed
    options:
      - 0.5x
      - 1x
      - 1.5x
      - 2x
    initial: 1x

  sbcp_wave_target:
    name: SBCP Wave Target
    options:
      - current_value
      - target_value
      - baseline_value
    initial: current_value

  sbcp_marker_primary_state:
    name: SBCP Marker Primary State
    options:
      - finite
      - unavailable
      - unknown
    initial: finite

  sbcp_marker_target_state:
    name: SBCP Marker Target State
    options:
      - finite
      - unavailable
      - unknown
    initial: finite

  sbcp_marker_reference_state:
    name: SBCP Marker Reference State
    options:
      - finite
      - unavailable
      - unknown
    initial: finite

  sbcp_baseline_semantic_mode:
    name: SBCP Baseline Semantic Mode
    options:
      - gradient
      - severity
      - severity_gradient
    initial: gradient

  sbcp_baseline_interval_profile:
    name: SBCP Baseline Interval Profile
    options:
      - very_small
      - irregular
      - even
      - full_width
    initial: even

input_text:
  sbcp_docs_transition_seconds:
    name: SBCP Documentation Transition Seconds
    initial: '6, 6, 6, 5, 4, 4, 6, 3'
    max: 64
    mode: text

  sbcp_label:
    name: SBCP Label
    initial: Playground Sensor
    max: 80

  sbcp_long_label:
    name: SBCP Long Label
    initial: Extremely Long Friendly Sensor Label For Alignment, Overflow, And Screenshot Testing
    max: 255

  sbcp_custom_raw_state:
    name: SBCP Custom Raw State
    initial: noisy-state
    max: 80

template:
  - sensor:
      - name: Visual Examples Primary Value
        default_entity_id: sensor.sbcp_examples_primary
        unit_of_measurement: W
        icon: mdi:flash
        state: "{{ states('input_number.sbcp_examples_primary') | float(0) }}"
      # Primary playground sensor. This is the entity most demo cards consume.
      - name: Playground Sensor
        default_entity_id: sensor.sbcp_playground_sensor
        unit_of_measurement: W
        icon: mdi:flash
        state: "{{ states('input_number.sbcp_current_value') | float(0) }}"
      # Helper values are mirrored as ordinary sensors so the card under test
      # always consumes entity states rather than helper entities directly.
      - name: SBCP Playground Wave Min
        default_entity_id: sensor.sbcp_playground_min
        unit_of_measurement: W
        icon: mdi:arrow-collapse-left
        state: "{{ states('input_number.sbcp_min_value') | float(0) }}"
      - name: SBCP Playground Wave Max
        default_entity_id: sensor.sbcp_playground_max
        unit_of_measurement: W
        icon: mdi:arrow-collapse-right
        state: "{{ states('input_number.sbcp_max_value') | float(0) }}"
      - name: SBCP Playground Scale Min
        default_entity_id: sensor.sbcp_playground_scale_min
        unit_of_measurement: W
        icon: mdi:arrow-expand-left
        state: "{{ states('input_number.sbcp_scale_min_value') | float(0) }}"
      - name: SBCP Playground Scale Max
        default_entity_id: sensor.sbcp_playground_scale_max
        unit_of_measurement: W
        icon: mdi:arrow-expand-right
        state: "{{ states('input_number.sbcp_scale_max_value') | float(0) }}"
      - name: SBCP Playground Target
        default_entity_id: sensor.sbcp_playground_target
        unit_of_measurement: W
        icon: mdi:bullseye-arrow
        state: "{{ states('input_number.sbcp_target_value') | float(0) }}"
      # Dedicated marker acceptance entities preserve the existing playground sensors.
      - name: SBCP Marker Acceptance Primary
        default_entity_id: sensor.sbcp_marker_primary
        unit_of_measurement: W
        icon: mdi:flash
        availability: "{{ states('input_select.sbcp_marker_primary_state') != 'unavailable' }}"
        state: >-
          {% if states('input_select.sbcp_marker_primary_state') == 'unknown' %}
            {{ none }}
          {% else %}
            {{ states('input_number.sbcp_marker_primary_value') | float(0) }}
          {% endif %}
      - name: SBCP Marker Acceptance Target
        default_entity_id: sensor.sbcp_marker_target
        unit_of_measurement: W
        icon: mdi:bullseye-arrow
        availability: "{{ states('input_select.sbcp_marker_target_state') != 'unavailable' }}"
        state: >-
          {% if states('input_select.sbcp_marker_target_state') == 'unknown' %}
            {{ none }}
          {% else %}
            {{ states('input_number.sbcp_marker_target_value') | float(0) }}
          {% endif %}
      - name: SBCP Marker Acceptance Reference
        default_entity_id: sensor.sbcp_marker_reference
        unit_of_measurement: kW
        icon: mdi:ray-vertex
        availability: "{{ states('input_select.sbcp_marker_reference_state') != 'unavailable' }}"
        state: >-
          {% if states('input_select.sbcp_marker_reference_state') == 'unknown' %}
            {{ none }}
          {% else %}
            {{ states('input_number.sbcp_marker_reference_value') | float(0) }}
          {% endif %}
      - name: SBCP Marker Scale Minimum
        default_entity_id: sensor.sbcp_marker_scale_min
        unit_of_measurement: W
        icon: mdi:arrow-expand-left
        state: "{{ states('input_number.sbcp_marker_scale_min_value') | float(100) }}"
      - name: SBCP Marker Scale Maximum
        default_entity_id: sensor.sbcp_marker_scale_max
        unit_of_measurement: W
        icon: mdi:arrow-expand-right
        state: "{{ states('input_number.sbcp_marker_scale_max_value') | float(300) }}"
      - name: SBCP Marker Comfort Range
        default_entity_id: sensor.sbcp_marker_comfort
        unit_of_measurement: °C
        icon: mdi:thermometer
        state: "21.8"
      - name: SBCP Playground Bar Height
        default_entity_id: sensor.sbcp_playground_bar_height
        unit_of_measurement: px
        icon: mdi:arrow-expand-vertical
        state: "{{ states('input_number.sbcp_bar_height') | int(38) }}"
      - name: SBCP Playground Decimal Precision
        default_entity_id: sensor.sbcp_playground_decimal_precision
        icon: mdi:decimal
        state: "{{ states('input_number.sbcp_decimal_precision') | int(1) }}"
      - name: SBCP Playground Color Mode
        default_entity_id: sensor.sbcp_playground_color_mode
        icon: mdi:palette-outline
        state: "{{ states('input_select.sbcp_color_mode') }}"
      - name: SBCP Playground Label Mode
        default_entity_id: sensor.sbcp_playground_label_mode
        icon: mdi:format-text
        state: "{{ states('input_select.sbcp_label_mode') }}"
      # Long-label entity for overflow and alignment checks.
      - name: Extremely Long Friendly Sensor Label For Alignment, Overflow, And Screenshot Testing
        default_entity_id: sensor.sbcp_playground_long_label
        unit_of_measurement: W
        icon: mdi:transmission-tower
        state: "{{ states('input_number.sbcp_current_value') | float(0) }}"
      # No icon attribute on purpose for missing-icon tests.
      - name: SBCP Playground No Icon
        default_entity_id: sensor.sbcp_playground_no_icon
        unit_of_measurement: W
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.82 + 5) | round(1) }}"
      - name: SBCP Playground Negative
        default_entity_id: sensor.sbcp_playground_negative
        unit_of_measurement: W
        icon: mdi:minus-circle-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) | abs * -1) | round(1) }}"
      - name: SBCP Playground Unavailable
        default_entity_id: sensor.sbcp_playground_unavailable
        icon: mdi:alert-circle-outline
        state: unavailable
      - name: SBCP Playground Unknown
        default_entity_id: sensor.sbcp_playground_unknown
        icon: mdi:help-circle-outline
        state: unknown
      - name: SBCP Playground Text State
        default_entity_id: sensor.sbcp_playground_text_state
        icon: mdi:message-alert-outline
        state: "{{ states('input_text.sbcp_custom_raw_state') }}"
      # Synthetic entities for multi-row rendering and stress tests.
      - name: SBCP Stress 01
        default_entity_id: sensor.sbcp_stress_01
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.35 + 6) | round(1) }}"
      - name: SBCP Stress 02
        default_entity_id: sensor.sbcp_stress_02
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.55 + 14) | round(1) }}"
      - name: SBCP Stress 03
        default_entity_id: sensor.sbcp_stress_03
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.75 + 22) | round(1) }}"
      - name: SBCP Stress 04
        default_entity_id: sensor.sbcp_stress_04
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.95 + 30) | round(1) }}"
      - name: SBCP Stress 05
        default_entity_id: sensor.sbcp_stress_05
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 1.05 + 12) | round(1) }}"
      - name: SBCP Stress 06
        default_entity_id: sensor.sbcp_stress_06
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 1.15 + 4) | round(1) }}"
      - name: SBCP Stress 07
        default_entity_id: sensor.sbcp_stress_07
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 1.35 - 8) | round(1) }}"
      - name: SBCP Stress 08
        default_entity_id: sensor.sbcp_stress_08
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 1.55 - 18) | round(1) }}"
      - name: SBCP Stress 09
        default_entity_id: sensor.sbcp_stress_09
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.45 + 40) | round(1) }}"
      - name: SBCP Stress 10
        default_entity_id: sensor.sbcp_stress_10
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.65 + 48) | round(1) }}"
      - name: SBCP Stress 11
        default_entity_id: sensor.sbcp_stress_11
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 0.85 + 56) | round(1) }}"
      - name: SBCP Stress 12
        default_entity_id: sensor.sbcp_stress_12
        unit_of_measurement: W
        icon: mdi:flash-outline
        state: "{{ (states('input_number.sbcp_current_value') | float(0) * 1.25 + 24) | round(1) }}"
      # Showcase-only synthetic telemetry. These are deterministic animated
      # entities for the promotional hero scene in the screenshots dashboard.
      - name: Daylight Progress
        default_entity_id: sensor.sbcp_showcase_daylight
        unit_of_measurement: '%'
        icon: mdi:white-balance-sunny
        state: >-
          {% set p = states('input_number.sbcp_showcase_phase') | float(0) %}
          {{ (((sin((p - 90) * pi / 180) + 1) / 2) * 100) | round(1) }}
      - name: Solar Production
        default_entity_id: sensor.sbcp_showcase_solar
        unit_of_measurement: W
        icon: mdi:solar-power
        state: >-
          {% set p = states('input_number.sbcp_showcase_phase') | float(0) %}
          {% set base = ((sin((p - 90) * pi / 180) + 1) / 2) %}
          {% set shimmer = ((sin((p + 35) * pi / 180) + 1) / 2) %}
          {{ (base * 6200 + shimmer * 700) | round(1) }}
      - name: Home Battery
        default_entity_id: sensor.sbcp_showcase_battery
        unit_of_measurement: '%'
        icon: mdi:home-battery
        state: >-
          {% set p = states('input_number.sbcp_showcase_phase') | float(0) %}
          {{ (58 + 24 * sin((p + 110) * pi / 180)) | round(1) }}
      - name: House Consumption
        default_entity_id: sensor.sbcp_showcase_consumption
        unit_of_measurement: W
        icon: mdi:home-lightning-bolt
        state: >-
          {% set p = states('input_number.sbcp_showcase_phase') | float(0) %}
          {{ (1850 + 420 * sin((p + 40) * pi / 180) + 180 * sin((p * 2) * pi / 180)) | round(1) }}
      - name: Grid Flow
        default_entity_id: sensor.sbcp_showcase_grid
        unit_of_measurement: W
        icon: mdi:transmission-tower
        state: >-
          {% set solar = states('sensor.sbcp_hero_solar') | float(0) %}
