# Sensor Bar Card Plus Playground package
# Install this file through Home Assistant packages so the dashboard can run
# without any real production sensors.

input_number:
  sbcp_current_value:
    name: SBCP Current Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 42.7
    unit_of_measurement: W

  sbcp_min_value:
    name: SBCP Wave Min Value
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: W

  sbcp_max_value:
    name: SBCP Wave Max Value
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 100
    unit_of_measurement: W

  sbcp_scale_min_value:
    name: SBCP Scale Min Value
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: W

  sbcp_scale_max_value:
    name: SBCP Scale Max Value
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 100
    unit_of_measurement: W

  sbcp_target_value:
    name: SBCP Target Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 65
    unit_of_measurement: W

  sbcp_marker_reference_value:
    name: SBCP Marker Reference Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 140
    unit_of_measurement: kW

  sbcp_marker_primary_value:
    name: SBCP Marker Primary Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 185
    unit_of_measurement: W

  sbcp_marker_target_value:
    name: SBCP Marker Target Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 65
    unit_of_measurement: W

  sbcp_marker_scale_min_value:
    name: SBCP Marker Scale Minimum
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 100
    unit_of_measurement: W

  sbcp_marker_scale_max_value:
    name: SBCP Marker Scale Maximum
    min: -5000
    max: 10000
    step: 1
    mode: box
    initial: 300
    unit_of_measurement: W

  sbcp_baseline_value:
    name: SBCP Baseline Value
    min: -5000
    max: 10000
    step: 0.1
    mode: box
    initial: 0
    unit_of_measurement: W

  # Dedicated Visual Examples controls. Scale ranges cannot cross, and the
  # reference ranges remain inside every allowed Scale. Other views keep
  # their existing playground controls and defaults.
  sbcp_examples_primary:
    name: Visual Examples · Power
    min: -2000
    max: 12000
    step: 100
    mode: slider
    initial: 7200
    unit_of_measurement: W

  sbcp_examples_scale_min:
    name: Visual Examples · Scale Minimum
    min: -2000
    max: 0
    step: 100
    mode: box
    initial: 0
    unit_of_measurement: W

  sbcp_examples_scale_max:
    name: Visual Examples · Scale Maximum
    min: 8000
    max: 12000
    step: 100
    mode: box
    initial: 10000
    unit_of_measurement: W

  sbcp_examples_baseline:
    name: Visual Examples · Baseline
    min: 0
    max: 6000
    step: 100
    mode: slider
    initial: 2000
    unit_of_measurement: W

  sbcp_examples_target:
    name: Visual Examples · Target Limit
    min: 4000
    max: 8000
    step: 100
    mode: slider
    initial: 6500
    unit_of_measurement: W

  sbcp_examples_reference:
    name: Visual Examples · Generic Reference
    min: 1000
    max: 7000
    step: 100
    mode: slider
    initial: 3500
    unit_of_measurement: W

  sbcp_examples_battery:
    name: Visual Examples · Battery Charge
    min: 0
    max: 100
    step: 1
    mode: slider
    initial: 83
    unit_of_measurement: "%"

  sbcp_current_quick:
    name: SBCP Current Quick Slider
    min: -100
    max: 100
    step: 0.1
    mode: slider
    initial: 42.7
    unit_of_measurement: W

  sbcp_target_quick:
    name: SBCP Target Quick Slider
    min: -100
    max: 100
    step: 0.1
    mode: slider
    initial: 65
    unit_of_measurement: W

  sbcp_baseline_quick:
    name: SBCP Baseline Quick Slider
    min: -100
    max: 100
    step: 0.1
    mode: slider
    initial: 0
    unit_of_measurement: W

  sbcp_bar_height:
    name: SBCP Bar Height
    min: 24
    max: 52
    step: 14
    mode: slider
    initial: 38
    unit_of_measurement: px

  sbcp_decimal_precision:
    name: SBCP Decimal Precision
    min: 0
    max: 2
    step: 1
    mode: slider
    initial: 1

  sbcp_wave_period:
    name: SBCP Wave Period
    min: 4
    max: 60
    step: 1
    mode: slider
    initial: 12
