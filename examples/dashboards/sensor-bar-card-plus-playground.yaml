  - type: markdown
    content: |
      ## Advanced marker integration — Needle

      The existing Wave Driver is intentionally reused. For the uncluttered motion test, set its min/max to 0/100, choose `current_value` and a 6–10 second period, then enable it: the Needle travels across stationary marker positions. The dense seven-marker card below combines Needle, Target, Peak, Floor, and two generic references in each lane; its Peak/Floor track the changing current sample. Watch the Needle approach, cross, coincide with, and leave the fixed references. Hover individual glyphs during motion to confirm the corresponding label still promotes independently. In the independent-source card, choose `target_value` to animate the dynamic generic marker while current/Needle remains still; switch back to `current_value` to watch it cross the marker. For the bipolar card, use wave limits -100/100 to watch current cross the stored Peak and Floor. The exact-coincidence card deliberately overlays the Needle, Target, and generic glyph. Turn the Wave Driver off after the check.
  - type: entities
    title: Needle / marker motion controls
    show_header_toggle: false
    entities:
    - entity: input_boolean.sbcp_wave_enabled
      name: Wave Driver
    - entity: input_select.sbcp_wave_target
      name: Animate current, Target, or baseline
    - entity: input_select.sbcp_waveform
      name: Waveform
    - entity: input_number.sbcp_wave_period
      name: Wave period
    - entity: input_number.sbcp_min_value
      name: Wave minimum
    - entity: input_number.sbcp_max_value
      name: Wave maximum
    - entity: input_number.sbcp_current_value
      name: Current / Needle source
    - entity: input_number.sbcp_target_value
      name: Dynamic marker source
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:sensor-bar-card-plus
      title: Moving Needle across stationary markers — 0..100 W
      entities:
      - entity: sensor.sbcp_playground_sensor
