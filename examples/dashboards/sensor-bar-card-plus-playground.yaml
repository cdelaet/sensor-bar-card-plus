- title: Needle
  path: sensor-bar-card-plus-needle
  icon: mdi:chart-timeline-variant
  badges: []
  cards:
  - type: markdown
    content: |
      ## Needle
      Dedicated validation surface for needle position, fill styles, marker layering, label modes, colors, and compact heights.

      Notes:
      - `Peak` uses the session-high behavior, so the "near peak" and "between target and peak" cards are interactive checks.
      - Use the shared playground controls to move current, target, and baseline helpers while inspecting these cards.
  - type: entities
    title: Needle Controls
    show_header_toggle: false
    entities:
    - entity: input_number.sbcp_current_value
