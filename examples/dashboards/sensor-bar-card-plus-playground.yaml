title: Sensor Bar Card Plus Playground
views:
- title: Playground
  path: sensor-bar-card-plus-playground
  icon: mdi:tune-vertical
  badges: []
  cards:
  - type: markdown
    content: |
      # Sensor Bar Card Plus Playground
      A self-contained Home Assistant demo for `custom:sensor-bar-card-plus`.

      This view is the clean showcase surface. All controls drive helper-backed template sensors, and every bar card still consumes normal `sensor.*` entities.
  - type: vertical-stack
    cards:
    - type: entities
      title: Scenario Controls
      show_header_toggle: false
      entities:
      - entity: input_number.sbcp_current_value
        name: Current value
      - entity: input_number.sbcp_target_value
        name: Target value
      - entity: input_number.sbcp_baseline_value
        name: Baseline value
      - entity: input_number.sbcp_scale_min_value
        name: Scale minimum
      - entity: input_number.sbcp_scale_max_value
        name: Scale maximum
      - entity: input_number.sbcp_min_value
        name: Wave minimum
      - entity: input_number.sbcp_max_value
        name: Wave maximum
      - entity: input_number.sbcp_current_quick
        name: Current quick slider (-100 to 100)
      - entity: input_number.sbcp_target_quick
        name: Target quick slider (-100 to 100)
      - entity: input_number.sbcp_baseline_quick
        name: Baseline quick slider (-100 to 100)
      - entity: input_boolean.sbcp_wave_enabled
        name: Wave drive helper
      - entity: input_select.sbcp_wave_target
        name: Wave target
      - entity: input_select.sbcp_waveform
        name: Waveform
      - entity: input_number.sbcp_wave_period
        name: Wave period
      - entity: input_select.sbcp_baseline_semantic_mode
        name: Semantic fill mode
      - entity: input_select.sbcp_baseline_interval_profile
        name: Interval profile
      - entity: input_text.sbcp_custom_raw_state
        name: Custom text state
    - type: entities
      title: Rendering Controls
      show_header_toggle: false
      entities:
      - entity: input_number.sbcp_bar_height
        name: Bar height
      - entity: input_number.sbcp_decimal_precision
        name: Decimal precision
      - entity: input_boolean.sbcp_animated
        name: Animated
      - entity: input_boolean.sbcp_target_enabled
        name: Show target marker
      - entity: input_boolean.sbcp_above_target_enabled
        name: Enable above-target color
      - entity: input_boolean.sbcp_show_target_label
        name: Show target label
      - entity: input_boolean.sbcp_show_peak
        name: Show peak
      - entity: input_select.sbcp_color_mode
        name: Active fill style preview
      - entity: input_select.sbcp_label_mode
        name: Active label mode preview
  - type: entities
    title: Live Sensor Snapshot
    show_header_toggle: false
    entities:
    - entity: sensor.sbcp_playground_sensor
      name: Primary sensor
    - entity: sensor.sbcp_playground_scale_min
      name: Min sensor
    - entity: sensor.sbcp_playground_scale_max
      name: Max sensor
    - entity: sensor.sbcp_playground_target
      name: Target sensor
    - entity: sensor.sbcp_playground_baseline
      name: Baseline sensor
    - entity: sensor.sbcp_playground_negative
      name: Negative sensor
    - entity: sensor.sbcp_playground_text_state
      name: Text-state sensor
  - type: markdown
    content: |
      ## Animation Preview
      Enable `Wave drive helper`, choose whether it targets the current value, the target value, or the baseline value, and select `sine`, `triangle`, or `random` for continuous motion. `Random` uses the full helper range instead of the active min/max scale.
  - type: custom:sensor-bar-card-plus
    title: Animated sensor preview
    entities:
    - entity: sensor.sbcp_playground_sensor
      name: Sensor
    layout:
      label:
        position: left
        width: 150
    scale:
      min:
        entity: sensor.sbcp_playground_scale_min
      max:
        entity: sensor.sbcp_playground_scale_max
    target:
      at:
        entity: sensor.sbcp_playground_target
      label:
        show: true
    peak:
      enabled: true
    bar:
      animated: true
      fill_style: gradient
  - type: markdown
    content: |
      ## Target And Highlight Toggles
      Use the helper switches to verify target marker on/off behavior and above-target highlighting on/off on a normal-width card.
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - entity: input_boolean.sbcp_target_enabled
        state: "on"
      - entity: input_boolean.sbcp_above_target_enabled
        state: "on"
      card:
        type: custom:sensor-bar-card-plus
        title: Target on / Above-target color on
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 160
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
          when_exceeded:
            fill_color: '#dc2626'
        bar:
          color: '#2563eb'
          fill_style: solid
    - type: conditional
      conditions:
      - entity: input_boolean.sbcp_target_enabled
        state: "on"
      - entity: input_boolean.sbcp_above_target_enabled
        state: "off"
      card:
        type: custom:sensor-bar-card-plus
        title: Target on / Above-target color off
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 160
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
          when_exceeded:
            fill_color:
        bar:
          color: '#2563eb'
          fill_style: solid
    - type: conditional
      conditions:
      - entity: input_boolean.sbcp_target_enabled
        state: "off"
      - entity: input_boolean.sbcp_above_target_enabled
        state: "on"
      card:
        type: custom:sensor-bar-card-plus
        title: Target off / Above-target color on
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 160
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at: {}
          label:
            show: false
          when_exceeded:
            fill_color: '#dc2626'
        bar:
          color: '#2563eb'
          fill_style: solid
    - type: conditional
      conditions:
      - entity: input_boolean.sbcp_target_enabled
        state: "off"
      - entity: input_boolean.sbcp_above_target_enabled
        state: "off"
      card:
        type: custom:sensor-bar-card-plus
        title: Target off / Above-target color off
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 160
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at: {}
          label:
            show: false
          when_exceeded:
            fill_color:
        bar:
          color: '#2563eb'
          fill_style: solid
  - type: markdown
    content: |
      ## Interactive Playground
      These cards respond directly to the active helper settings and are intended to be the main debugging and screenshot surface.
  - type: custom:sensor-bar-card-plus
    entity: sensor.sbcp_playground_sensor
    card_mod:
      style: |
        ha-card {
          background: red !important;
          border: 6px solid yellow !important;
          border-radius: 24px !important;
          padding: 16px !important;
        }
  - type: vertical-stack
    cards:
    - type: markdown
      content: |
        **Live Fill Style Preview**
        Switch the helper and compare the currently selected color algorithm on the same sensor and same scale.
    - type: conditional
      conditions:
      - entity: input_select.sbcp_color_mode
        state: gradient
      card:
        type: custom:sensor-bar-card-plus
        title: "Active fill style: gradient"
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 150
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
          when_exceeded:
            fill_color: '#991b1b'
        bar:
          gradient_stops:
          - pos: 0
            color: '#2563eb'
          - pos: 45
            color: '#06b6d4'
          - pos: 75
            color: '#f59e0b'
          - pos: 100
            color: '#dc2626'
          fill_style: gradient
    - type: conditional
      conditions:
      - entity: input_select.sbcp_color_mode
        state: severity
      card:
        type: custom:sensor-bar-card-plus
        title: "Active fill style: bands"
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 150
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
        bar:
          segments:
          - from: 0%
            to: 35%
            color: '#22c55e'
          - from: 35%
            to: 70%
            color: '#f59e0b'
          - from: 70%
            to: 100%
            color: '#ef4444'
          fill_style: bands
    - type: conditional
      conditions:
      - entity: input_select.sbcp_color_mode
        state: severity_gradient
      card:
        type: custom:sensor-bar-card-plus
        title: "Active fill style: band_gradient"
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 150
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
        bar:
          segments:
          - from: 0%
            to: 35%
            color: '#22c55e'
          - from: 35%
            to: 70%
            color: '#f59e0b'
          - from: 70%
            to: 100%
            color: '#ef4444'
          fill_style: band_gradient
    - type: conditional
      conditions:
      - entity: input_select.sbcp_color_mode
        state: single
      card:
        type: custom:sensor-bar-card-plus
        title: "Active fill style: solid"
        entities:
        - entity: sensor.sbcp_playground_sensor
          name: Sensor
        layout:
          label:
            position: left
            width: 150
        scale:
          min:
            entity: sensor.sbcp_playground_scale_min
          max:
            entity: sensor.sbcp_playground_scale_max
        target:
          at:
            entity: sensor.sbcp_playground_target
          label:
            show: true
          when_exceeded:
            fill_color: '#ef4444'
        bar:
          color: '#0f766e'
          fill_style: solid
  - type: vertical-stack
    cards:
    - type: markdown
      content: |
        **Live Label Mode Preview**
        Switch the helper and verify the same sensor under each label placement mode.
    - type: conditional
