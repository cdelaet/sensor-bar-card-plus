    scale:
      min:
        entity: sensor.sbcp_marker_scale_min
      max:
        entity: sensor.sbcp_marker_scale_max
    formatting:
      decimal: 2
    markers:
    - at: 0%
      lane: above
      shape: circle
      color: '#2563EB'
    - at: 35%
      lane: above
      shape: diamond
      color: '#0891B2'
      label:
        show: true
        decimal: 0
        show_unit: true
    - at: 100%
      lane: below
      shape: chevron
      color: '#7C3AED'

  - type: custom:sensor-bar-card-plus
    title: Off-scale raw values — glyphs clamp, labels do not
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Reference row (W)
    scale:
      min:
        fixed: 0
      max:
        fixed: 100
    markers:
    - at:
        fixed: -20
      lane: below
      shape: triangle
      color: '#DC2626'
      label:
        show: true
        decimal: 0
    - at:
        fixed: 140
      lane: below
      shape: pin
      color: '#EA580C'
      label:
        show: true
        decimal: 0
    - at:
        entity: sensor.sbcp_marker_reference
      lane: above
      shape: arrow
      color: '#2563EB'
      label:
        show: true
        decimal: 0

  - type: markdown
    content: |
      Set the generic reference number to -20 and then 140. Its helper advertises kW, but on this W row the marker uses the raw number: the glyph clamps to the nearest endpoint and the label retains -20 W or 140 W. The two fixed references provide the same raw-value/clamped-position check.

  - type: markdown
    content: |
      ## Source Resolution

      Fixed, percentage, dynamic-only, and dynamic-with-fixed-fallback sources are shown together. With the default 140 reference, the dynamic value wins over fallback 75 and is clamped at the right edge. Set its state to unavailable, then unknown, then finite: dynamic-only hides, while dynamic-plus-fixed resolves to 75. The displayed unit remains the W row unit throughout.

  - type: entities
    title: Dynamic generic source controls
    show_header_toggle: false
    entities:
    - entity: input_number.sbcp_marker_reference_value
      name: Dynamic source number (kW metadata; no conversion)
    - entity: input_select.sbcp_marker_reference_state
      name: Source state — finite / unavailable / unknown

  - type: custom:sensor-bar-card-plus
    title: Fixed, percentage, dynamic, fallback, and state recovery
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Reference row (W)
    scale:
      min:
        fixed: 0
      max:
        fixed: 100
    formatting:
      decimal: 1
    markers:
    - at:
        fixed: 25
      lane: above
      shape: circle
      color: '#16A34A'
      label:
        show: true
        decimal: 0
    - at:
        entity: sensor.sbcp_marker_reference
      lane: above
      shape: arrow
      color: '#2563EB'
      label:
        show: true
        decimal: 0
    - at: 35%
      lane: below
      shape: diamond
      color: '#0891B2'
      label:
        show: true
        decimal: 0
    - at:
        entity: sensor.sbcp_marker_reference
        fixed: 75
      lane: below
      shape: pin
      color: '#DC2626'
      label:
        show: true
        decimal: 0

  - type: markdown
    content: |
      ## Peak and Floor — reset windows

      Change the dedicated primary sample between highs and lows. Unavailable/unknown primary states should pause ingestion without erasing the tracked extrema. The never policy persists for the card instance; 1m starts at its initializing finite sample and resets lazily at the next finite update after expiry. Quarterly uses local quarter-hour boundaries and is intentionally different from relative 15m; hourly uses the local hour boundary.

  - type: entities
    title: Extrema sample controls
    show_header_toggle: false
    entities:
    - entity: input_number.sbcp_marker_primary_value
      name: Primary sample (W)
    - entity: input_select.sbcp_marker_primary_state
      name: Primary state

  - type: markdown
    content: |
      ### LIVE EXTREMA TRACKING — RESET NEVER

      This card tests pure session extrema tracking with a continuously oscillating battery value. Reset is `never`: Max can only move upward and Min can only move downward, even as the current value reverses. If the value is stationary, confirm the existing SBCP Showcase Enabled helper is on. Use the timed reset examples below to test reset behavior separately.

  - type: custom:sensor-bar-card-plus
    title: Live extrema tracking — Reset never
    entities:
    - entity: sensor.sbcp_showcase_battery
      name: Battery charge
    scale:
      min:
        fixed: 0
      max:
        fixed: 100
    peak:
      enabled: true
      reset: never
      color: '#7C3AED'
      label:
        show: true
        text: Max
    floor:
      enabled: true
      reset: never
      color: '#D97706'
      label:
        show: true
        text: Min

  - type: custom:sensor-bar-card-plus
    title: Peak — never
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Highest sample
    scale:
      min:
        fixed: -100
      max:
        fixed: 300
    peak:
      enabled: true
      reset: never
      color: '#7C3AED'
      label:
        show: true
        decimal: 1

  - type: custom:sensor-bar-card-plus
    title: Floor — never
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Lowest sample
    scale:
      min:
        fixed: -100
      max:
        fixed: 300
    floor:
      enabled: true
      reset: never
      color: '#D97706'
      label:
        show: true
        decimal: 1

  - type: custom:sensor-bar-card-plus
    title: Peak and Floor — independent relative 1m windows
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Rolling extrema
    scale:
      min:
        fixed: -100
      max:
        fixed: 300
    peak:
      enabled: true
      reset: 1m
      color: '#7C3AED'
      label:
        show: true
    floor:
      enabled: true
      reset: 1m
      color: '#D97706'
      label:
        show: true

  - type: custom:sensor-bar-card-plus
    title: Peak quarterly and Floor hourly
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Local calendar windows
    scale:
      min:
        fixed: -100
      max:
        fixed: 300
    peak:
      enabled: true
      reset: quarterly
      color: '#7C3AED'
      label:
        show: true
    floor:
      enabled: true
      reset: hourly
      color: '#D97706'
      label:
        show: true

  - type: markdown
    content: |
      ## Layout and Density

      These examples isolate lane height and label placement, then combine a compact group of realistic energy rows. Glyph-only rows should retain compact spacing; visible labels add the below-lane spacing; above places the sensor label above the bar and can overlap marker labels.

  - type: custom:sensor-bar-card-plus
    title: Glyph-only rows — compact lanes
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Grid
    - entity: sensor.sbcp_marker_target
      name: Target reference
    scale:
      min:
        fixed: 0
      max:
        fixed: 300
    peak:
      enabled: true
      reset: never
    floor:
      enabled: true
      reset: never
    markers:
    - at: 35%
      lane: above
      shape: diamond
      color: '#2563EB'
    - at:
        fixed: 210
      lane: below
      shape: circle
      color: '#16A34A'

  - type: custom:sensor-bar-card-plus
    title: Labelled below lane — additional marker spacing
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Grid demand
    scale:
      min:
        fixed: 0
      max:
        fixed: 300
    target:
      at:
        fixed: 225
      label:
        show: true
        decimal: 0
    floor:
      enabled: true
      reset: never
      label:
        show: true
        decimal: 0
    markers:
    - at: 35%
      lane: below
      shape: pin
      color: '#0891B2'
      label:
        show: true
        decimal: 0

  - type: custom:sensor-bar-card-plus
    title: Above sensor label — overlay behavior
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Main service feed
    scale:
      min:
        fixed: 0
      max:
        fixed: 300
    layout:
      label:
        position: above
    markers:
    - at: 35%
      lane: above
      shape: arrow
      color: '#7C3AED'
      label:
        show: true
        decimal: 0
    - at: 70%
      lane: above
      shape: diamond
      color: '#DC2626'
      label:
        show: true
        decimal: 0

  - type: custom:sensor-bar-card-plus
    title: Realistic multi-row household power density
    entities:
    - entity: sensor.sbcp_showcase_solar
      name: Rooftop solar
      icon: mdi:solar-power
      scale:
        min:
          fixed: 0
        max:
          fixed: 8000
    - entity: sensor.sbcp_showcase_battery_power
      name: Battery flow
      icon: mdi:home-battery
      scale:
        min:
          fixed: -4000
        max:
          fixed: 4000
    - entity: sensor.sbcp_showcase_grid
      name: Utility exchange
      icon: mdi:transmission-tower
      scale:
        min:
          fixed: -5000
        max:
          fixed: 5000
    layout:
      label:
        position: left
        width: 170
      height: 34
    formatting:
      decimal: 0
    bar:
      fill_style: gradient
      gradient_stops:
      - pos: 0
        color: '#1D4ED8'
      - pos: 50
        color: '#0F766E'
      - pos: 100
        color: '#F59E0B'
    target:
      at:
        fixed: 1200
      color: '#F8FAFC'
    markers:
    - at: 35%
      lane: above
      shape: diamond
      color: '#38BDF8'
    - at: 70%
      lane: below
      shape: pin
      color: '#FDE047'

  - type: markdown
    content: |
      ### Per-row marker mix — vertical multi-row density

      A normal compact household stack with deliberately different row configurations: no markers, glyph-only, labelled above, labelled below, both lanes, and multiple below labels. Compare row height and spacing; glyph-only rows should stay compact and labelled below lanes should receive only their normal clearance.

  - type: custom:sensor-bar-card-plus
    title: Household power — mixed marker rows
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Grid demand — no markers
      scale:
        min:
          fixed: 0
        max:
          fixed: 300
    - entity: sensor.sbcp_showcase_solar
      name: Rooftop solar — glyph only
      icon: mdi:solar-power
      scale:
        min:
          fixed: 0
        max:
          fixed: 8000
      markers:
      - at: 65%
        lane: above
        shape: diamond
        color: '#38BDF8'
    - entity: sensor.sbcp_showcase_battery_power
      name: Battery — glyph-only extrema
      icon: mdi:home-battery
      scale:
        min:
          fixed: -6000
        max:
          fixed: 3000
      peak:
        enabled: true
        reset: never
      floor:
        enabled: true
        reset: never
    - entity: sensor.sbcp_hero_shot_grid
      name: Utility exchange — above label
      icon: mdi:transmission-tower
      scale:
        min:
          fixed: -10
        max:
          fixed: 10
      formatting:
        decimal: 1
        unit: kW
      markers:
      - at: 68%
        lane: above
        shape: arrow
        color: '#2563EB'
        label:
          show: true
    - entity: sensor.sbcp_showcase_grid_voltage
      name: Distribution voltage — below label
      icon: mdi:sine-wave
      scale:
        min:
          fixed: 100
        max:
          fixed: 300
      formatting:
        decimal: 1
        unit: V
      target:
        at:
          fixed: 230
        label:
          show: true
    - entity: sensor.sbcp_showcase_consumption
      name: Household load — both lanes
      icon: mdi:home-lightning-bolt
      scale:
        min:
          fixed: 0
        max:
          fixed: 3000
      peak:
        enabled: true
        reset: never
        label:
          show: true
      markers:
      - at: 38%
        lane: above
        shape: diamond
        color: '#0F766E'
        label:
          show: true
      - at: 76%
        lane: below
        shape: pin
        color: '#F59E0B'
    - entity: sensor.sbcp_marker_primary
      name: Grid demand — multiple below labels
      scale:
        min:
          fixed: 0
        max:
          fixed: 300
      target:
        at:
          fixed: 215
        label:
          show: true
      floor:
        enabled: true
        reset: never
        label:
          show: true
      markers:
      - at: 32%
        lane: below
        shape: circle
        color: '#7C3AED'
        label:
          show: true
      - at: 84%
        lane: below
        shape: diamond
        color: '#DC2626'
        label:
          show: true
    layout:
      label:
        position: left
        width: 190
      height: 34
    formatting:
      decimal: 0
    bar:
      fill_style: gradient
      gradient_stops:
      - pos: 0
        color: '#1D4ED8'
      - pos: 50
        color: '#0F766E'
      - pos: 100
        color: '#F59E0B'

  - type: markdown
    content: |
      ## Semantic Label / Label Content

      These compact examples isolate the independent label components. Compare value + unit, semantic text + value + unit, text + value without unit, text + unit without value, text only, value only, and unit only. Empty composition is intentionally covered in automated tests and should produce no visible label.

  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:sensor-bar-card-plus
      title: Target / extrema semantics
      entities:
      - entity: sensor.sbcp_marker_primary
        name: House load
      scale:
        min: { fixed: 0 }
        max: { fixed: 300 }
      formatting:
        decimal: 1
        unit: W
      target:
        at: 180
        label:
          show: true
          text: Target
          show_value: true
          show_unit: true
      peak:
        enabled: true
        reset: never
        label:
          show: true
          text: Max
      floor:
        enabled: true
        reset: never
        label:
          show: true
          text: Min

    - type: custom:sensor-bar-card-plus
      title: Generic compositions
      entities:
      - entity: sensor.sbcp_marker_primary
        name: Grid exchange
      scale:
        min: { fixed: -300 }
        max: { fixed: 300 }
      formatting:
        decimal: 1
        unit: W
      markers:
      - at: 25%
        lane: above
        shape: diamond
        color: '#2563EB'
        label:
          show: true
          text: Prediction
          show_value: true
          show_unit: false
      - at: 72%
        lane: below
        shape: pin
        color: '#F59E0B'
        label:
          show: true
          text: Trigger
          show_value: false
          show_unit: true

    - type: custom:sensor-bar-card-plus
      title: Text only / value only
      entities:
      - entity: sensor.sbcp_marker_primary
        name: Solar output
      scale:
        min: { fixed: 0 }
        max: { fixed: 10 }
      formatting:
        decimal: 1
        unit: kW
      markers:
      - at: 30%
        lane: above
        shape: circle
        color: '#7C3AED'
        label:
          show: true
          text: Previous max
          show_value: false
          show_unit: false
      - at: 55%
        lane: above
        shape: diamond
        color: '#0891B2'
        label:
          show: true
      - at: 75%
        lane: below
        shape: triangle
        color: '#DC2626'
        label:
          show: true
          show_unit: false

    - type: custom:sensor-bar-card-plus
      title: Unit only / text + unit
      entities:
      - entity: sensor.sbcp_marker_primary
        name: Supply voltage
      scale:
        min: { fixed: 225 }
        max: { fixed: 233 }
      formatting:
        decimal: 2
        unit: V
      markers:
      - at: 20%
        lane: above
        shape: chevron
        color: '#0891B2'
        label:
          show: true
          show_value: false
          show_unit: true
      - at: 80%
        lane: below
        shape: arrow
        color: '#16A34A'
        label:
          show: true
          text: High
          show_value: false
          show_unit: true

  - type: markdown
    content: |
      ## Visual editor handoff

      Use a disposable card in an editable Home Assistant dashboard to check add/remove/reorder, source modes, lane/shape/color/label options, card-level inheritance, entity list replacement, explicit markers: [], and save/reopen preservation of excess configured markers. This YAML playground demonstrates runtime acceptance and does not replace the editor round-trip check.
