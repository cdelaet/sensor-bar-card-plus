- title: Markers
  path: markers
  icon: mdi:map-marker-multiple
  badges: []
  cards:
  - type: markdown
    content: |
      # Marker System — Manual Acceptance

      Work down the page. Each group keeps its instructions beside the cards that use them. Deliberate label overlaps are limited to the Collision Lab and the explicitly named five-card stress case. Peak/Floor state is in-memory and timing resets are lazy: the next finite sample after a boundary or expiry starts the new window.

  - type: markdown
    content: |
      ## Overview — a realistic energy row

      The dedicated primary and Target controls below are isolated from the older playground controls. The reference helper deliberately reports kW while the row is W: marker values are read directly on the row scale, without conversion, and marker labels use the row unit.

  - type: entities
    title: Overview controls
    show_header_toggle: false
    entities:
    - entity: input_number.sbcp_marker_primary_value
      name: Primary sample (W)
    - entity: input_select.sbcp_marker_primary_state
      name: Primary state
    - entity: input_number.sbcp_marker_target_value
      name: Target reference (W)
    - entity: input_select.sbcp_marker_target_state
      name: Target source state
    - entity: input_number.sbcp_marker_reference_value
      name: Generic reference number (source metadata kW)
    - entity: input_select.sbcp_marker_reference_state
      name: Generic source state

  - type: custom:sensor-bar-card-plus
    title: Home energy — Target, Peak, Floor, and references
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Grid demand
      icon: mdi:transmission-tower
    scale:
      min:
        fixed: 0
      max:
        fixed: 300
    formatting:
      decimal: 1
    layout:
      label:
        position: left
        width: 170
    bar:
      fill_style: band_gradient
      segments:
      - from: 0%
        to: 35%
        color: '#16A34A'
      - from: 35%
        to: 75%
        color: '#0EA5E9'
      - from: 75%
        to: 100%
        color: '#F59E0B'
    target:
      at:
        entity: sensor.sbcp_marker_target
      color: '#F8FAFC'
      label:
        show: true
        decimal: 0
    peak:
      enabled: true
      reset: never
      color: '#A78BFA'
    floor:
      enabled: true
      reset: never
      color: '#F97316'
    markers:
    - at: 35%
      lane: above
      shape: diamond
      color: '#38BDF8'
      label:
        show: true
        decimal: 0
        show_unit: false
    - at:
        entity: sensor.sbcp_marker_reference
        fixed: 75
      lane: below
      shape: pin
      color: '#FBBF24'
      label:
        show: true
        decimal: 0

  - type: markdown
    content: |
      ## Responsive / Grid Density Laboratory

      The first comparison holds the complete card and marker configuration constant; only the number of cards across changes. Inspect sensor-name truncation/placement, value placement and any moved-above/top-right transition, marker-label overlap and its relationship to the real sensor name/value, both lanes, bar geometry, row/card height, glyph anchoring, and overall usability. Do not simplify the configuration at narrower widths. The same entity is intentionally repeated when the dashboard permits it.

  - &marker_density_reference
    type: custom:sensor-bar-card-plus
    title: Same marker reference — compare width only
    entities:
    - entity: sensor.sbcp_marker_primary
      name: Kitchen grid import — afternoon reading
      icon: mdi:transmission-tower
    scale:
      min:
        fixed: -500
      max:
        fixed: 1500
    formatting:
      decimal: 1
    bar:
      fill_style: gradient
      gradient_stops:
      - pos: 0
        color: '#1D4ED8'
      - pos: 55
        color: '#0F766E'
      - pos: 100
        color: '#F59E0B'
    markers:
    - at: 35%
      lane: above
      shape: diamond
      color: '#38BDF8'
      label:
        show: true
        decimal: 0
    - at: 68%
      lane: below
      shape: pin
      color: '#FBBF24'
      label:
        show: true
        decimal: 0
    - at:
        fixed: 1250
      lane: below
      shape: circle
      color: '#DC2626'

  - type: markdown
    content: |
      ### 1 card across

      Full-width baseline for the exact configuration reused below.

  - *marker_density_reference

  - type: markdown
    content: |
      ### 2 cards across — identical reference cards

      Compare against the full-width baseline; card configuration and entity are unchanged.

  - type: grid
    columns: 2
    square: false
    cards:
    - *marker_density_reference
    - *marker_density_reference

  - type: markdown
    content: |
      ### 3 cards across — identical reference cards

      Compare truncation, moved value, labels, lane appearance, geometry, and anchoring with the same reference at 1 and 2 across.

  - type: grid
    columns: 3
    square: false
    cards:
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference

  - type: markdown
    content: |
      ### 4 cards across — identical reference cards

      Keep the marker setup fixed and note where responsive presentation changes, if at all.

  - type: grid
    columns: 4
    square: false
    cards:
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference

  - type: markdown
    content: |
      ### 5 cards across — identical reference cards

      Deliberate width stress case. Record when the row becomes difficult to read; do not tune individual cards to hide that transition.

  - type: grid
    columns: 5
    square: false
    cards:
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference
    - *marker_density_reference

  - type: markdown
    content: |
      ### Mixed markers — 2 cards across

      Plausible combinations at the same dashboard width: a labelled Target with one generic reference, and labelled Peak/Floor with one generic reference. Check label priority and that row units remain consistent.

  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:sensor-bar-card-plus
      title: Target and reference — grid demand
      entities:
      - entity: sensor.sbcp_marker_primary
        name: Grid demand
      scale:
        min:
          fixed: -500
        max:
          fixed: 1500
      formatting:
        decimal: 0
      target:
        at:
          fixed: 900
        label:
          show: true
      markers:
      - at: 62%
        lane: above
        shape: diamond
        color: '#38BDF8'
        label:
          show: true
    - type: custom:sensor-bar-card-plus
      title: Peak, Floor, and reference
      entities:
      - entity: sensor.sbcp_showcase_battery_power
        name: Battery charge / discharge
      scale:
        min:
          fixed: -6000
        max:
          fixed: 3000
      formatting:
        decimal: 0
      peak:
        enabled: true
        reset: never
        label:
          show: true
      floor:
        enabled: true
        reset: never
        label:
          show: true
      markers:
      - at: 55%
        lane: above
        shape: pin
        color: '#F59E0B'
        label:
          show: true

  - type: markdown
    content: |
      ### Presentation modes — 3 cards across

      Normal, inside, and Hero remain marker-bearing at reduced width. Compare name/value priority and visible above/below labels; Hero headline content should remain clear of marker labels.

  - type: grid
    columns: 3
    square: false
