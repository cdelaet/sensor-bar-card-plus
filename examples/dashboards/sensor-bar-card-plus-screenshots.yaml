      - type: markdown
        content: |
          ## Built-in and generic references
          The first row has a live diamond Target, plus triangular Peak (above) and Floor (below). Move Power to **3000**, then **9000**, then back to **7200 W** to separate the session extrema. Fill above Target becomes vivid blue (**#00B2FF**), distinct from the magenta palette color. Peak/Floor history resets when the card is recreated.

          The second row separates a live inward Pin (above), a fixed **75%** outward Chevron (below), and a label-only endpoint. **Now** reads the primary sensor independently of its fixed endpoint position. Move Reference or change the Scale to compare value and percentage anchors. Labels can overlap at narrow widths; hover where available to raise a label.
