- title: Marker Showcase
  path: marker-showcase
  icon: mdi:map-marker-multiple
  badges: []
  cards:
  - type: vertical-stack
    cards:
    - type: markdown
      content: |
        # Sensor Bar Card Plus — Marker Showcase

        Curated marker examples for static capture and live acceptance. The existing Showcase Phase Driver animates a few practical rows; the screenshot-only Hero entities remain stable for deterministic captures.

    - type: markdown
      content: |
        ## Live multi-row energy

        Three related W rows share a restrained above/below reference treatment while their phase-driven values evolve. Peak and Floor labels show the observed range without turning the card into a collision test.

    - type: custom:sensor-bar-card-plus
      title: Home energy — live grid, solar, and battery rows
      entities:
      - entity: sensor.sbcp_showcase_grid
        name: Grid exchange
        scale:
          min:
            fixed: -6000
          max:
            fixed: 6000
      - entity: sensor.sbcp_showcase_solar
        name: Solar production
        scale:
          min:
            fixed: 0
          max:
            fixed: 8000
      - entity: sensor.sbcp_showcase_battery_power
        name: Battery charge / discharge
        scale:
          min:
            fixed: -2500
          max:
            fixed: 2500
      layout:
        label:
          position: left
          width: 150
      formatting:
        decimal: 0
      peak:
        enabled: true
        reset: never
        color: '#7C3AED'
        label:
          show: true
          decimal: 0
          text: Max
      floor:
        enabled: true
        reset: never
        color: '#EA580C'
        label:
          show: true
          decimal: 0
          text: Min
      markers:
