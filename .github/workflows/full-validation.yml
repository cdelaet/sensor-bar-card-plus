name: Full Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false

  validate-dist-unit:
    name: Dist and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record tested commit
        run: |
          echo "Tested commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist before tests can rebuild it
        run: npm run verify-dist

      - name: Check bundle syntax
        run: node --check dist/sensor-bar-card-plus.js

      - name: Set up Python for converter tests
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install converter test dependency
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" -m pip install ruamel.yaml==0.19.1'

      - name: Run unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:unit

      - name: Confirm tests left committed dist unchanged
        run: git diff --exit-code -- dist/sensor-bar-card-plus.js

  validate-browser:
    name: Playwright (macOS)
    needs: [validate-dist-unit, validate-hacs]
    runs-on: macos-26
    env:
      SBCP_VISUAL_BASELINE: ci
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record tested commit
        run: |
          echo "Tested commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist
        run: npm run verify-dist

      - name: Install required Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run complete Playwright suite against existing baselines
        run: npm run test:visual -- --workers=1 --update-snapshots=none

      - name: Preserve Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 7
