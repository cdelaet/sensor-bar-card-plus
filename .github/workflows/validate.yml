name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      generate_snapshots:
        description: Generate canonical macOS visual snapshots
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false

  validate-dist-unit:
    name: Dist and unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist before tests can rebuild it
        run: npm run verify-dist

      - name: Check bundle syntax
        run: node --check dist/sensor-bar-card-plus.js

      - name: Set up Python for converter tests
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install converter test dependency
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" -m pip install ruamel.yaml==0.19.1'

      - name: Run unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:unit

      - name: Confirm tests left committed dist unchanged
        run: git diff --exit-code -- dist/sensor-bar-card-plus.js

  validate-browser:
    name: Playwright (macOS)
    if: github.event_name != 'schedule'
    needs: [validate-dist-unit, validate-hacs]
    # Screenshot baselines are macOS-only; canonical replacements are generated only by explicit manual dispatch.
    runs-on: macos-26
    env:
      SBCP_VISUAL_BASELINE: ci
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist
        run: npm run verify-dist

      - name: Install required Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run complete Playwright suite against existing baselines
        if: github.event_name != 'workflow_dispatch' || inputs.generate_snapshots != true
        run: npm run test:visual -- --workers=3 --update-snapshots=none

      - name: Generate complete canonical Playwright snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.generate_snapshots
        run: npm run test:visual -- --workers=3 --update-snapshots

      - name: Upload canonical Playwright snapshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.generate_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: canonical-playwright-snapshots-${{ github.sha }}
          path: tests/visual/snapshots/ci/**/*-darwin.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 7
