name: Fast Validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
          comment: false

  validate-dist-unit:
    name: Dist and unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist before tests can rebuild it
        run: npm run verify-dist

      - name: Check both ESM bundles
        run: |
          node --input-type=module --check < dist/sensor-bar-card-plus.js
          node --input-type=module --check < dist/sensor-bar-card-plus-editor.js

      - name: Install Chromium for native ESM loading checks
        run: npx playwright install --with-deps chromium

      - name: Check lazy editors in a browser
        run: npx playwright test lazy-editor-loading.spec.js --project='' --workers=1

      - name: Set up Python for converter tests
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install converter test dependency
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" -m pip install ruamel.yaml==0.19.1'

      - name: Run unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:unit

      - name: Confirm tests left committed dist unchanged
        run: git diff --exit-code -- dist/sensor-bar-card-plus.js dist/sensor-bar-card-plus-editor.js
