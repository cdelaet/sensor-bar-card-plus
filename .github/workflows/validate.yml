name: Fast Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (pinned)
        with:
          category: plugin
          comment: false

  validate-dist-unit:
    name: Dist and unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist before tests can rebuild it
        run: npm run verify-dist

      - name: Check both ESM bundles
        run: |
          node --input-type=module --check < dist/sensor-bar-card-plus.js
          node --input-type=module --check < dist/sensor-bar-card-plus-editor.js

      - name: Set up Python for converter tests
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install converter test dependency
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: '"$PYTHON" -m pip install ruamel.yaml==0.19.1'

      - name: Run unit tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: npm run test:unit

      - name: Confirm tests left committed dist unchanged
        run: git diff --exit-code -- dist/sensor-bar-card-plus.js dist/sensor-bar-card-plus-editor.js

  validate-browser:
    name: Browser smoke (Chromium and WebKit)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run focused browser regression suite
        run: npm run test:visual:fast

      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: focused-playwright-failures-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          include-hidden-files: true
          retention-days: 7
