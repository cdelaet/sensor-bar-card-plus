name: Update Canonical Snapshots

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch whose canonical snapshots should be generated
        required: true
        type: string
      allow_snapshot_set_changes:
        description: Allow added, deleted, or renamed canonical snapshots
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: canonical-snapshots-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate canonical snapshots
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      source_branch: ${{ steps.source.outputs.source_branch }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      total: ${{ steps.inspect.outputs.total }}
      modified: ${{ steps.inspect.outputs.modified }}
      added: ${{ steps.inspect.outputs.added }}
      deleted: ${{ steps.inspect.outputs.deleted }}
      renamed: ${{ steps.inspect.outputs.renamed }}
      unchanged: ${{ steps.inspect.outputs.unchanged }}
      has_changes: ${{ steps.inspect.outputs.has_changes }}
      artifact_name: ${{ steps.inspect.outputs.artifact_name }}
    env:
      SBCP_VISUAL_BASELINE: ci
    steps:
      - name: Require dispatch from trusted main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from trusted main and pass the source branch as an input." >&2
            exit 1
          fi

      - name: Resolve source branch and exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          if [[ -z "$SOURCE_BRANCH" ]] || ! git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "source_branch must be a valid branch name." >&2
            exit 1
          fi
          ENCODED_BRANCH="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SOURCE_BRANCH")"
          SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENCODED_BRANCH" --jq '.commit.sha')"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub did not resolve source_branch to a commit SHA." >&2
            exit 1
          fi
          {
            echo "source_branch=$SOURCE_BRANCH"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist
        run: npm run verify-dist

      - name: Install required Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Record pre-generation untracked path inventories
        id: baseline
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          import os
          import base64

          prefix = b"tests/visual/snapshots/ci/"
          # Playwright's built-in LastRunReporter creates this one routine runtime file.
          playwright_last_run = b"test-results/.last-run.json"
          # Dependency contents are setup inputs and would make step outputs unbounded.
          dependency_component = b"node_modules"
          max_inventory_bytes = 128 * 1024

          def paths(*args):
              return sorted(path for path in subprocess.check_output(["git", *args]).split(b"\0") if path)

          ignored = paths("ls-files", "--others", "--ignored", "--exclude-standard", "-z")
          untracked = paths("ls-files", "--others", "--exclude-standard", "-z")
          ignored_ci = [path for path in ignored if path.startswith(prefix)]
          if ignored_ci:
              raise SystemExit("Unexpected ignored files already exist in the canonical CI snapshot tree.")

          def outside_inventory(items):
              return [
                  path for path in items
                  if not path.startswith(prefix)
                  and path != playwright_last_run
                  and dependency_component not in path.split(b"/")
              ]

          def digest(items):
              return hashlib.sha256(b"\0".join(items)).hexdigest()

          ignored_outside = outside_inventory(ignored)
          untracked_outside = outside_inventory(untracked)
          encoded = {}
          for name, items in (("ignored", ignored_outside), ("untracked", untracked_outside)):
              raw = b"\0".join(items)
              if len(raw) > max_inventory_bytes:
                  raise SystemExit(f"The {name} path inventory exceeds the safe GitHub output limit.")
              encoded[name] = base64.b64encode(raw).decode("ascii")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"ignored_outside_b64={encoded['ignored']}\n")
              stream.write(f"ignored_outside_sha256={digest(ignored_outside)}\n")
              stream.write(f"untracked_outside_b64={encoded['untracked']}\n")
              stream.write(f"untracked_outside_sha256={digest(untracked_outside)}\n")
          PY

      - name: Generate complete canonical Playwright snapshots
        run: npm run test:visual -- --workers=1 --update-snapshots

      - name: Inspect changes and prepare complete snapshot artifact
        id: inspect
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ALLOW_SET_CHANGES: ${{ inputs.allow_snapshot_set_changes }}
          DISPATCHER_SHA: ${{ github.sha }}
          BASELINE_IGNORED_OUTSIDE_B64: ${{ steps.baseline.outputs.ignored_outside_b64 }}
          BASELINE_IGNORED_OUTSIDE_SHA256: ${{ steps.baseline.outputs.ignored_outside_sha256 }}
          BASELINE_UNTRACKED_OUTSIDE_B64: ${{ steps.baseline.outputs.untracked_outside_b64 }}
          BASELINE_UNTRACKED_OUTSIDE_SHA256: ${{ steps.baseline.outputs.untracked_outside_sha256 }}
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import base64
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          snapshot_root = Path("tests/visual/snapshots/ci")
          artifact_root = Path("snapshot-artifact")
          prefix = "tests/visual/snapshots/ci/"
          prefix_bytes = prefix.encode()
          # Playwright's built-in LastRunReporter creates this one routine runtime file.
          playwright_last_run = b"test-results/.last-run.json"
          # Dependency contents are setup inputs and would make step outputs unbounded.
          dependency_component = b"node_modules"

          def git(*args):
              return subprocess.check_output(["git", *args])

          def output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
                  stream.write(f"{name}={value}\n")

          tracked = git("diff", "--name-only", "-z", "--no-renames", "HEAD").split(b"\0")
          untracked = git("ls-files", "--others", "--exclude-standard", "-z").split(b"\0")
          ignored = git("ls-files", "--others", "--ignored", "--exclude-standard", "-z").split(b"\0")
          ignored = [p for p in ignored if p]
          ignored_ci = [p for p in ignored if p.startswith(prefix.encode())]
          changed = {p.decode("utf-8", "surrogateescape") for p in tracked + untracked + ignored_ci if p}

          def digest(items):
              return hashlib.sha256(b"\0".join(sorted(items))).hexdigest()

          def outside_inventory(items):
              return sorted(
                  path for path in items
                  if path
                  and not path.startswith(prefix_bytes)
                  and path != playwright_last_run
                  and dependency_component not in path.split(b"/")
              )

          def decode_inventory(name):
              raw = base64.b64decode(os.environ[name], validate=True)
              return [path for path in raw.split(b"\0") if path]

          def display_path(path):
              value = os.fsdecode(path)
              if any(ord(char) < 32 or ord(char) == 127 for char in value):
                  return json.dumps(value, ensure_ascii=True)
              return value.encode("utf-8", "backslashreplace").decode("utf-8")

          inventory_deltas = {}
          for name, current in (
              ("ignored", outside_inventory(ignored)),
              ("untracked", outside_inventory(untracked)),
          ):
              baseline = decode_inventory(f"BASELINE_{name.upper()}_OUTSIDE_B64")
              baseline_digest = os.environ[f"BASELINE_{name.upper()}_OUTSIDE_SHA256"]
              if digest(baseline) != baseline_digest:
                  raise SystemExit(f"The trusted baseline {name} path inventory failed its digest check.")
              added_paths = sorted(set(current) - set(baseline))
              removed_paths = sorted(set(baseline) - set(current))
              inventory_deltas[name] = (added_paths, removed_paths)
              if digest(current) != baseline_digest:
                  changed.update(path.decode("utf-8", "surrogateescape") for path in added_paths + removed_paths)

          invalid = sorted(p for p in changed if not (p.startswith(prefix) and p.endswith(".png")))
          candidates = sorted(p for p in snapshot_root.rglob("*") if p.suffix == ".png")
          unsafe_pngs = [p.as_posix() for p in candidates if p.is_symlink()]
          if unsafe_pngs:
              invalid.extend(unsafe_pngs)
          pngs = [p for p in candidates if p.is_file() and not p.is_symlink()]

          # Stage only after verifying every changed path, then use Git's rename detection for the manifest.
          changes = []
          if not invalid:
              subprocess.run(["git", "add", "-A", "-f", "--", str(snapshot_root)], check=True)
              fields = git("diff", "--cached", "--name-status", "-z", "--find-renames", "HEAD").split(b"\0")
              i = 0
              while i < len(fields) and fields[i]:
                  status = fields[i].decode()
                  i += 1
                  if status.startswith("R") or status.startswith("C"):
                      old_path = fields[i].decode("utf-8", "surrogateescape")
                      path = fields[i + 1].decode("utf-8", "surrogateescape")
                      i += 2
                      changes.append({"status": status, "old_path": old_path, "path": path})
                  else:
                      path = fields[i].decode("utf-8", "surrogateescape")
                      i += 1
                      changes.append({"status": status, "path": path})
          modified = sum(c["status"].startswith("M") for c in changes)
          added = sum(c["status"] == "A" for c in changes)
          deleted = sum(c["status"] == "D" for c in changes)
          renamed = sum(c["status"].startswith("R") for c in changes)
          total = len(pngs)
          unchanged = max(0, total - modified - added - renamed)
          artifact_name = f"canonical-playwright-snapshots-{os.environ['SOURCE_SHA']}"
          manifest = {
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_sha": os.environ["SOURCE_SHA"],
              "runner": "macos-26",
              "canonical_environment": "SBCP_VISUAL_BASELINE=ci",
              "generation_command": "npm run test:visual -- --workers=1 --update-snapshots",
              "dispatcher_sha": os.environ["DISPATCHER_SHA"],
              "total": total,
              "modified": modified,
              "added": added,
              "deleted": deleted,
              "renamed": renamed,
              "unchanged": unchanged,
              "allow_snapshot_set_changes": os.environ["ALLOW_SET_CHANGES"].lower() == "true",
              "changed_paths": changes,
              "snapshot_sha256": {p.relative_to(snapshot_root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in pngs},
              "invalid_paths": invalid,
          }

          if artifact_root.exists():
              shutil.rmtree(artifact_root)
          destination = artifact_root / snapshot_root
          destination.mkdir(parents=True)
          for path in pngs:
              target = destination / path.relative_to(snapshot_root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
          (artifact_root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          set_changes = added + deleted + renamed
          allowed = os.environ["ALLOW_SET_CHANGES"].lower() == "true"
          has_changes = bool(changes)
          for key, value in {
              "total": total,
              "modified": modified,
              "added": added,
              "deleted": deleted,
              "renamed": renamed,
              "unchanged": unchanged,
              "has_changes": str(has_changes).lower(),
              "artifact_name": artifact_name,
              "manifest_created": "true",
          }.items():
              output(key, value)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write(f"## Canonical snapshot generation\n\nSource: `{os.environ['SOURCE_BRANCH']}` at `{os.environ['SOURCE_SHA']}`\n\n")
              stream.write(f"Runner: `macos-26` · total: **{total}** · modified: **{modified}** · added: **{added}** · deleted: **{deleted}** · renamed: **{renamed}** · unchanged: **{unchanged}**\n\n")
              stream.write(f"Snapshot-set changes allowed: **{str(allowed).lower()}** · artifact: `{artifact_name}`\n")
              if invalid:
                  stream.write("\n### File-safety failure\n\nUnexpected paths:\n" + "\n".join(f"- `{p}`" for p in invalid) + "\n")
              for name, (added_paths, removed_paths) in inventory_deltas.items():
                  if added_paths:
                      stream.write(f"\n{name.title()} paths added outside canonical CI snapshots:\n" + "\n".join(f"- `{display_path(p)}`" for p in added_paths) + "\n")
                  if removed_paths:
                      stream.write(f"\n{name.title()} paths removed outside canonical CI snapshots:\n" + "\n".join(f"- `{display_path(p)}`" for p in removed_paths) + "\n")
              if set_changes and not allowed:
                  stream.write("\n### Snapshot-set changes rejected\n\nSet `allow_snapshot_set_changes=true` for an intentional addition, deletion, or rename.\n")
              if set_changes and allowed:
                  stream.write(f"\n### Snapshot-set changes explicitly allowed\n\n**{added} added · {deleted} deleted · {renamed} renamed**\n")

          if invalid:
              print("Snapshot generation changed paths outside the canonical CI PNG tree:", file=sys.stderr)
              inventory_paths = {
                  path.decode("utf-8", "surrogateescape")
                  for added_paths, removed_paths in inventory_deltas.values()
                  for path in added_paths + removed_paths
              }
              for name, (added_paths, removed_paths) in inventory_deltas.items():
                  if added_paths:
                      print(f"{name.title()} paths added outside canonical CI snapshots:", file=sys.stderr)
                      for path in added_paths:
                          print(f"- {display_path(path)}", file=sys.stderr)
                  if removed_paths:
                      print(f"{name.title()} paths removed outside canonical CI snapshots:", file=sys.stderr)
                      for path in removed_paths:
                          print(f"- {display_path(path)}", file=sys.stderr)
              for path in invalid:
                  if path not in inventory_paths:
                      print(f"- {path}", file=sys.stderr)
              sys.exit(1)
          if set_changes and not allowed:
              print("Canonical snapshot additions, deletions, and renames require allow_snapshot_set_changes=true.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload complete canonical snapshot artifact
        if: always() && steps.inspect.outputs.manifest_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: canonical-playwright-snapshots-${{ steps.source.outputs.source_sha }}
          path: snapshot-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish snapshot review PR
    needs: generate
    if: needs.generate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      generated_branch: ${{ steps.prepare.outputs.generated_branch }}
      pull_request_url: ${{ steps.pr.outputs.pull_request_url }}
      validation_status: ${{ steps.validation.outputs.validation_status }}
    steps:
      - name: Download complete canonical snapshot artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.generate.outputs.artifact_name }}
          path: ${{ runner.temp }}/snapshot-artifact

      - name: Check out exact source commit as data
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.generate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up GitHub CLI authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Revalidate artifact, source tip, and Git changes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.generate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/snapshot-artifact
          ALLOW_SET_CHANGES: ${{ inputs.allow_snapshot_set_changes }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          artifact = Path(os.environ["ARTIFACT_DIR"])
          snapshot_rel = Path("tests/visual/snapshots/ci")
          snapshot_prefix = "tests/visual/snapshots/ci/"
          manifest_path = artifact / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          source_branch = os.environ["SOURCE_BRANCH"]
          source_sha = os.environ["SOURCE_SHA"]
          allowed = os.environ["ALLOW_SET_CHANGES"].lower() == "true"

          if manifest.get("source_branch") != source_branch or manifest.get("source_sha") != source_sha:
              raise SystemExit("Artifact provenance does not match the recorded source branch and SHA.")
          if manifest.get("runner") != "macos-26" or manifest.get("canonical_environment") != "SBCP_VISUAL_BASELINE=ci":
              raise SystemExit("Artifact manifest does not identify the canonical runner/environment.")
          if bool(manifest.get("allow_snapshot_set_changes")) != allowed:
              raise SystemExit("Artifact manifest set-change policy does not match workflow input.")

          files = sorted(p for p in artifact.rglob("*") if p.is_file())
          symlinks = [p for p in artifact.rglob("*") if p.is_symlink()]
          if symlinks:
              raise SystemExit("Artifact contains symbolic links.")
          pngs = []
          artifact_hashes = {}
          for path in files:
              if path == manifest_path:
                  continue
              rel = path.relative_to(artifact).as_posix()
              parts = PurePosixPath(rel).parts
              if (PurePosixPath(rel).is_absolute() or any(part in ("", ".", "..") for part in parts)
                      or "\\" in rel or not rel.startswith(snapshot_prefix) or not rel.endswith(".png")):
                  raise SystemExit(f"Artifact contains an unexpected path: {rel}")
              if path.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Artifact file is not a PNG: {rel}")
              pngs.append((rel, path))
              artifact_hashes[rel.removeprefix(snapshot_prefix)] = hashlib.sha256(path.read_bytes()).hexdigest()
          if not manifest_path.is_file() or not pngs:
              raise SystemExit("Artifact is missing its manifest or complete snapshot tree.")
          if len(pngs) != manifest.get("total"):
              raise SystemExit("Artifact PNG count does not match the manifest.")
          if manifest.get("generation_command") != "npm run test:visual -- --workers=1 --update-snapshots":
              raise SystemExit("Artifact manifest does not record the canonical generation command.")
          if artifact_hashes != manifest.get("snapshot_sha256"):
              raise SystemExit("Artifact PNG bytes do not match the manifest SHA-256 values.")

          # Derive a stable reserved ref from the original branch name, not its sanitized spelling alone.
          slug = re.sub(r"[^a-z0-9._-]+", "-", source_branch.lower())
          slug = re.sub(r"-+", "-", slug).strip(".-_")[:48].rstrip(".-_") or "branch"
          branch_hash = hashlib.sha256(source_branch.encode("utf-8")).hexdigest()[:10]
          generated_branch = f"automation/canonical-snapshots/{slug}-{branch_hash}"

          encoded = subprocess.check_output([
              "python3", "-c", "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))", source_branch
          ], text=True).strip()
          response = subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/branches/{encoded}", "--jq", ".commit.sha"
          ], text=True).strip()
          if response != source_sha:
              raise SystemExit(f"Source branch advanced from {source_sha} to {response}; rerun for the new tip.")

          # Reject source-controlled links or special files before writing through any checkout path.
          workspace_stat = os.lstat(root)
          if not stat.S_ISDIR(workspace_stat.st_mode):
              raise SystemExit("Publisher workspace root is not a real directory.")

          canonical_parts = snapshot_rel.parts
          current = root
          missing_ancestor = False
          for part in canonical_parts:
              current = current / part
              try:
                  component_stat = os.lstat(current)
              except FileNotFoundError:
                  missing_ancestor = True
                  continue
              if missing_ancestor or not stat.S_ISDIR(component_stat.st_mode):
                  raise SystemExit(f"Canonical snapshot ancestry is not a real directory: {current}")

          canonical_root = root.joinpath(*canonical_parts)
          canonical_resolved = canonical_root.resolve(strict=False)

          def checked_destination(rel):
              logical = PurePosixPath(rel)
              parts = logical.parts
              if (logical.is_absolute() or any(part in ("", ".", "..") for part in parts)
                      or "\\" in rel or parts[:len(canonical_parts)] != canonical_parts
                      or not rel.endswith(".png")):
                  raise SystemExit(f"Unsafe canonical snapshot destination: {rel}")

              target = root.joinpath(*parts)
              parent = root
              for part in parts[:-1]:
                  parent = parent / part
                  try:
                      parent_stat = os.lstat(parent)
                  except FileNotFoundError:
                      continue
                  if not stat.S_ISDIR(parent_stat.st_mode):
                      raise SystemExit(f"Snapshot destination parent is not a real directory: {parent}")

              try:
                  target.parent.resolve(strict=False).relative_to(canonical_resolved)
              except ValueError:
                  raise SystemExit(f"Snapshot destination escapes the canonical root: {rel}")
              try:
                  target_stat = os.lstat(target)
              except FileNotFoundError:
                  target_stat = None
              if target_stat is not None and not stat.S_ISREG(target_stat.st_mode):
                  raise SystemExit(f"Snapshot destination is not a regular file: {rel}")
              return target

          # Rebuild the complete snapshot tree. Never run code from this checkout.
          tracked = subprocess.check_output(["git", "ls-files", "-z", "--", str(snapshot_rel)]).split(b"\0")
          tracked = [p.decode("utf-8", "surrogateescape") for p in tracked if p]
          if any(not p.startswith(snapshot_prefix) or not p.endswith(".png") for p in tracked):
              raise SystemExit("Source commit contains a non-PNG tracked file in the canonical snapshot tree.")
          tracked_targets = {rel: checked_destination(rel) for rel in tracked}
          destinations = {rel: checked_destination(rel) for rel, _ in pngs}

          # Validate every source and destination before deleting or copying any file.
          for rel, target in tracked_targets.items():
              if not target.exists():
                  raise SystemExit(f"Tracked source snapshot is missing: {rel}")
          for target in tracked_targets.values():
              target.unlink()
          for rel, path in pngs:
              target = destinations[rel]
              if target.exists():
                  target.unlink()
              target.parent.mkdir(parents=True, exist_ok=True)
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(target, flags, 0o644)
              with os.fdopen(descriptor, "wb") as destination, path.open("rb") as source:
                  shutil.copyfileobj(source, destination)

          for rel, target in destinations.items():
              ensure_parent = target.parent.resolve(strict=True)
              try:
                  ensure_parent.relative_to(canonical_root.resolve(strict=True))
              except ValueError:
                  raise SystemExit(f"Reconstructed snapshot escapes the canonical root: {rel}")
              if not stat.S_ISREG(os.lstat(target).st_mode):
                  raise SystemExit(f"Reconstructed snapshot is not a regular file: {rel}")
              if target.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Reconstructed snapshot is not a PNG: {rel}")
          reconstructed_hashes = {
              rel.removeprefix(snapshot_prefix): hashlib.sha256(destinations[rel].read_bytes()).hexdigest()
              for rel, _ in pngs
          }
          if reconstructed_hashes != artifact_hashes:
              raise SystemExit("Reconstructed snapshot tree does not match the downloaded artifact bytes.")

          subprocess.run(["git", "add", "-A", "-f", "--", str(snapshot_rel)], check=True)
          raw = subprocess.check_output(["git", "diff", "--cached", "--name-status", "-z", "--find-renames", "HEAD"]).split(b"\0")
          changes = []
          i = 0
          while i < len(raw) and raw[i]:
              status = raw[i].decode()
              i += 1
              if status.startswith("R") or status.startswith("C"):
                  old_path = raw[i].decode("utf-8", "surrogateescape")
                  path = raw[i + 1].decode("utf-8", "surrogateescape")
                  i += 2
                  changes.append({"status": status, "old_path": old_path, "path": path})
              else:
                  path = raw[i].decode("utf-8", "surrogateescape")
                  i += 1
                  changes.append({"status": status, "path": path})

          for change in changes:
              paths = [change["path"]] + ([change["old_path"]] if "old_path" in change else [])
              if any(not p.startswith(snapshot_prefix) or not p.endswith(".png") for p in paths):
                  raise SystemExit(f"Publisher reconstructed an out-of-scope Git change: {change}")
          if changes != manifest.get("changed_paths"):
              raise SystemExit("Reconstructed Git changes do not exactly match the signed-off generation manifest.")
          set_changes = sum(c["status"] == "A" or c["status"] == "D" or c["status"].startswith("R") for c in changes)
          if set_changes and not allowed:
              raise SystemExit("Snapshot-set changes are present but allow_snapshot_set_changes is false.")

          modified = sum(c["status"].startswith("M") for c in changes)
          added = sum(c["status"] == "A" for c in changes)
          deleted = sum(c["status"] == "D" for c in changes)
          renamed = sum(c["status"].startswith("R") for c in changes)
          unchanged = len(pngs) - modified - added - renamed
          if len(pngs) != len(tracked) + added - deleted:
              raise SystemExit("Artifact snapshot count does not match the source tree plus snapshot-set changes.")
          for key, value in {"modified": modified, "added": added, "deleted": deleted,
                             "renamed": renamed, "unchanged": unchanged}.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Artifact manifest count mismatch for {key}.")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"generated_branch={generated_branch}\n")
              stream.write(f"has_changes={str(bool(changes)).lower()}\n")
          if not changes:
              result = subprocess.run([
                  "gh", "pr", "list", "--head", f"{os.environ['GITHUB_REPOSITORY_OWNER']}:{generated_branch}",
                  "--base", source_branch, "--state", "open", "--json", "url,headRefName,baseRefName"
              ], check=True, text=True, capture_output=True)
              open_prs = json.loads(result.stdout)
              url = next((pr["url"] for pr in open_prs if pr.get("headRefName") == generated_branch and pr.get("baseRefName") == source_branch), "")
              with open(output, "a", encoding="utf-8") as stream:
                  stream.write(f"stale_pr_url={url}\n")
          PY

      - name: Summarize no-change result
        if: steps.prepare.outputs.has_changes != 'true'
        env:
          STALE_PR_URL: ${{ steps.prepare.outputs.stale_pr_url }}
          SOURCE_BRANCH: ${{ needs.generate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        run: |
          {
            printf '%s\n\n' '## Canonical snapshot publisher'
            printf 'Source: %c%s%c at %c%s%c\n\n' '`' "$SOURCE_BRANCH" '`' '`' "$SOURCE_SHA" '`'
            printf '%s\n' 'No snapshot changes; no PR was created.'
            if [[ -n "$STALE_PR_URL" ]]; then printf '\nAn open generated PR exists and was left unchanged because the source tree is current: %s\n' "$STALE_PR_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require trusted Full Validation definition
        if: steps.prepare.outputs.has_changes == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: trusted-main
          persist-credentials: false

      - name: Commit and publish generated snapshot branch
        id: push
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.generate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
          GENERATED_BRANCH: ${{ steps.prepare.outputs.generated_branch }}
          TOTAL: ${{ needs.generate.outputs.total }}
          MODIFIED: ${{ needs.generate.outputs.modified }}
          ADDED: ${{ needs.generate.outputs.added }}
          DELETED: ${{ needs.generate.outputs.deleted }}
          RENAMED: ${{ needs.generate.outputs.renamed }}
          UNCHANGED: ${{ needs.generate.outputs.unchanged }}
          ARTIFACT_NAME: ${{ needs.generate.outputs.artifact_name }}
        run: |
          set -euo pipefail
          if ! cmp -s trusted-main/.github/workflows/full-validation.yml .github/workflows/full-validation.yml; then
            echo "Refusing to dispatch Full Validation because the source branch changes its workflow definition." >&2
            exit 1
          fi
          ENCODED_BRANCH="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SOURCE_BRANCH")"
          CURRENT_SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENCODED_BRANCH" --jq '.commit.sha')"
          if [[ "$CURRENT_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "Source branch advanced from $SOURCE_SHA to $CURRENT_SOURCE_SHA; rerun for the new tip." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "test: update canonical snapshots for ${SOURCE_SHA:0:12}" -m "Source branch: ${SOURCE_BRANCH}" -m "Source SHA: ${SOURCE_SHA}" -m "Generated on: macos-26"
          git switch -c "$GENERATED_BRANCH"

          REF="refs/heads/$GENERATED_BRANCH"
          REMOTE_LINE="$(git ls-remote --heads origin "$REF" | awk -v ref="$REF" '$2 == ref { print $1 " " $2 }')"
          if [[ -n "$REMOTE_LINE" ]]; then
            REMOTE_SHA="${REMOTE_LINE%% *}"
            git fetch --no-tags origin "$REF"
            FETCHED_SHA="$(git rev-parse FETCH_HEAD)"
            [[ "$REMOTE_SHA" == "$FETCHED_SHA" ]]
            read -r COMMIT PARENT EXTRA <<< "$(git rev-list --parents -n 1 "$FETCHED_SHA")"
            if [[ "$COMMIT" != "$REMOTE_SHA" || -z "${PARENT:-}" || -n "${EXTRA:-}" ]]; then
              echo "Existing generated branch is not a single generated snapshot commit; refusing to rewrite it." >&2
              exit 1
            fi
            SUBJECT="$(git show -s --format=%s "$REMOTE_SHA")"
            BODY="$(git show -s --format=%B "$REMOTE_SHA")"
            if [[ "$SUBJECT" != "test: update canonical snapshots for ${PARENT:0:12}" ]] || ! grep -Fxq -- "Source branch: $SOURCE_BRANCH" <<< "$BODY" || ! grep -Fxq -- "Source SHA: $PARENT" <<< "$BODY" || ! git merge-base --is-ancestor "$PARENT" "$SOURCE_SHA"; then
              echo "Existing generated branch lacks expected automation provenance; refusing to rewrite it." >&2
              exit 1
            fi
            if ! python3 - "$PARENT" "$REMOTE_SHA" <<'PY'
          import subprocess
          import sys
          paths = subprocess.check_output([
              "git", "diff-tree", "--no-commit-id", "--name-only", "-r", "-z", "--no-renames", sys.argv[1], sys.argv[2]
          ]).split(b"\0")
          prefix = b"tests/visual/snapshots/ci/"
          invalid = [path for path in paths if path and not (path.startswith(prefix) and path.endswith(b".png"))]
          if invalid:
              print("Existing generated branch contains out-of-scope paths:", *invalid, sep="\n- ", file=sys.stderr)
              sys.exit(1)
          PY
            then
              echo "Existing generated branch contains changes outside canonical CI PNGs; refusing to rewrite it." >&2
              exit 1
            fi
            git push --force-with-lease="$REF:$REMOTE_SHA" origin "HEAD:$REF"
          else
            git push origin "HEAD:$REF"
          fi

          echo "generated_branch=$GENERATED_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update generated snapshot PR
        id: pr
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ needs.generate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
          GENERATED_BRANCH: ${{ steps.prepare.outputs.generated_branch }}
          TOTAL: ${{ needs.generate.outputs.total }}
          MODIFIED: ${{ needs.generate.outputs.modified }}
          ADDED: ${{ needs.generate.outputs.added }}
          DELETED: ${{ needs.generate.outputs.deleted }}
          RENAMED: ${{ needs.generate.outputs.renamed }}
          UNCHANGED: ${{ needs.generate.outputs.unchanged }}
          ARTIFACT_NAME: ${{ needs.generate.outputs.artifact_name }}
          ALLOW_SET_CHANGES: ${{ inputs.allow_snapshot_set_changes }}
        run: |
          ENCODED_BRANCH="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SOURCE_BRANCH")"
          CURRENT_SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/$ENCODED_BRANCH" --jq '.commit.sha')"
          if [[ "$CURRENT_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "Source branch advanced from $SOURCE_SHA to $CURRENT_SOURCE_SHA; rerun for the new tip." >&2
            exit 1
          fi
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          branch = os.environ["SOURCE_BRANCH"]
          sha = os.environ["SOURCE_SHA"]
          generated = os.environ["GENERATED_BRANCH"]
          title = f"Update canonical snapshots for {generated.rsplit('/', 1)[-1]}"
          escaped_branch = html.escape(branch)
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = f"""Canonical snapshot update

          Source branch: <code>{escaped_branch}</code>
          Source SHA: <code>{sha}</code>
          Runner: macos-26

          Snapshots:
          {os.environ['MODIFIED']} modified
          {os.environ['ADDED']} added
          {os.environ['DELETED']} deleted
          {os.environ['RENAMED']} renamed
          {os.environ['UNCHANGED']} unchanged

          Snapshot-set changes explicitly allowed: {os.environ['ALLOW_SET_CHANGES']}

          Validation:
          - canonical generation: passed
          - file-safety gate: passed
          - Full Validation: dispatched separately after PR publication; status is in the workflow run

          These images were generated automatically.
          Human visual review is required before merging.

          Workflow run: {run_url}
          Complete artifact: {os.environ['ARTIFACT_NAME']}
          """
          body = "\n".join(line.lstrip() for line in body.splitlines()).strip() + "\n"
          Path(os.environ["RUNNER_TEMP"], "snapshot-pr.json").write_text(
              json.dumps({"title": title, "body": body}), encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"], "snapshot-pr-body.md").write_text(body, encoding="utf-8")
          PY

          PR_DATA="$(gh pr list --head "$GITHUB_REPOSITORY_OWNER:$GENERATED_BRANCH" --base "$SOURCE_BRANCH" --state all --json number,url,state,headRefName,baseRefName,mergedAt)"
          PR_NUMBER="$(python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[r for r in rows if r["headRefName"] == sys.argv[1] and r["baseRefName"] == sys.argv[2]]; print(rows[0]["number"] if rows else "")' "$GENERATED_BRANCH" "$SOURCE_BRANCH" <<< "$PR_DATA")"
          PR_STATE=""
          MERGED_AT=""
          if [[ -n "$PR_NUMBER" ]]; then
            PR_STATE="$(python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[r for r in rows if r["number"] == int(sys.argv[1])]; print(rows[0]["state"] if rows else "")' "$PR_NUMBER" <<< "$PR_DATA")"
            MERGED_AT="$(python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[r for r in rows if r["number"] == int(sys.argv[1])]; print(rows[0]["mergedAt"] or "" if rows else "")' "$PR_NUMBER" <<< "$PR_DATA")"
          fi
          TITLE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$RUNNER_TEMP/snapshot-pr.json")"
          if [[ -n "$PR_NUMBER" && -z "$MERGED_AT" ]]; then
            if [[ "$PR_STATE" == "CLOSED" ]]; then gh pr reopen "$PR_NUMBER"; fi
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body-file "$RUNNER_TEMP/snapshot-pr-body.md"
            PR_URL="$(gh pr view "$PR_NUMBER" --json url --jq .url)"
          else
            if ! PR_URL="$(gh pr create --title "$TITLE" --body-file "$RUNNER_TEMP/snapshot-pr-body.md" --base "$SOURCE_BRANCH" --head "$GENERATED_BRANCH" 2>"$RUNNER_TEMP/pr-create-error")"; then
              PR_URL=""
            fi
            if [[ -z "$PR_URL" ]]; then
              PR_URL="$(gh pr list --head "$GITHUB_REPOSITORY_OWNER:$GENERATED_BRANCH" --base "$SOURCE_BRANCH" --state open --json url,headRefName,baseRefName | python3 -c 'import json,sys; rows=json.load(sys.stdin); rows=[r for r in rows if r["headRefName"] == sys.argv[1] and r["baseRefName"] == sys.argv[2]]; print(rows[0]["url"] if rows else "")' "$GENERATED_BRANCH" "$SOURCE_BRANCH")"
              if [[ -z "$PR_URL" ]]; then cat "$RUNNER_TEMP/pr-create-error" >&2; echo "Could not create or identify the generated snapshot PR." >&2; exit 1; fi
            fi
          fi
          echo "pull_request_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Dispatch Full Validation for generated branch
        id: validation
        if: steps.prepare.outputs.has_changes == 'true' && steps.pr.outputs.pull_request_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.prepare.outputs.generated_branch }}
        run: |
          if gh workflow run full-validation.yml --ref "$GENERATED_BRANCH"; then
            echo "validation_status=dispatched" >> "$GITHUB_OUTPUT"
          else
            echo "validation_status=failed to dispatch" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write publisher summary
        if: always()
        env:
          SOURCE_BRANCH: ${{ needs.generate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
          GENERATED_BRANCH: ${{ steps.prepare.outputs.generated_branch }}
          PR_URL: ${{ steps.pr.outputs.pull_request_url }}
          VALIDATION_STATUS: ${{ steps.validation.outputs.validation_status }}
          HAS_CHANGES: ${{ steps.prepare.outputs.has_changes }}
          TOTAL: ${{ needs.generate.outputs.total }}
          MODIFIED: ${{ needs.generate.outputs.modified }}
          ADDED: ${{ needs.generate.outputs.added }}
          DELETED: ${{ needs.generate.outputs.deleted }}
          RENAMED: ${{ needs.generate.outputs.renamed }}
          UNCHANGED: ${{ needs.generate.outputs.unchanged }}
        run: |
          {
            printf '%s\n\n' '## Canonical snapshot publisher'
            printf 'Source: %c%s%c at %c%s%c\n\n' '`' "$SOURCE_BRANCH" '`' '`' "$SOURCE_SHA" '`'
            printf 'Generated branch: %c%s%c\n\n' '`' "${GENERATED_BRANCH:-not created}" '`'
            printf 'Snapshots: %s total · %s modified · %s added · %s deleted · %s renamed · %s unchanged\n\n' "$TOTAL" "$MODIFIED" "$ADDED" "$DELETED" "$RENAMED" "$UNCHANGED"
            printf 'PR: %s\n\n' "${PR_URL:-none}"
            printf 'Full Validation: %s\n' "${VALIDATION_STATUS:-not dispatched}"
          } >> "$GITHUB_STEP_SUMMARY"
