name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 1.8.0)
        required: true
        type: string
      title:
        description: Descriptive GitHub Release title
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v5

      - name: Validate release inputs and package version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be semantic MAJOR.MINOR.PATCH without a v prefix." >&2
            exit 1
          fi
          if [[ -z "$RELEASE_TITLE" || ${#RELEASE_TITLE} -gt 255 || "$RELEASE_TITLE" == *$'\n'* || "$RELEASE_TITLE" == *$'\r'* ]]; then
            echo "Title must be a non-empty, single-line value of at most 255 characters." >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Requested version $RELEASE_VERSION does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require the current main commit and successful Full Validation
        id: validation
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const tag = process.env.RELEASE_TAG;
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            if (main.commit.sha !== sha) {
              throw new Error(`Release run SHA ${sha} is not the current main SHA ${main.commit.sha}.`);
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'full-validation.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              head_sha: sha,
              status: 'success',
              per_page: 100,
            });
            const run = runs.find(candidate =>
              candidate.head_sha === sha && candidate.head_branch === 'main' &&
              candidate.event === 'workflow_dispatch' && candidate.conclusion === 'success');
            if (!run) {
              throw new Error(`No successful Full Validation run exists for exact main commit ${sha}. Fast Validation does not qualify.`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            for (const name of ['HACS', 'Dist and unit tests', 'Playwright (macOS)']) {
              if (!jobs.some(job => job.name === name && job.conclusion === 'success')) {
                throw new Error(`Full Validation run ${run.id} lacks a successful required job: ${name}`);
              }
            }

            for (const [label, check] of [
              ['tag', () => github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })],
              ['release', () => github.rest.repos.getReleaseByTag({ ...context.repo, tag })],
            ]) {
              try {
                await check();
                throw new Error(`Refusing to reuse existing ${label} for ${tag}.`);
              } catch (error) {
                if (error.message.startsWith('Refusing to reuse existing')) throw error;
                if (error.status !== 404) throw error;
              }
            }

            core.setOutput('run_id', String(run.id));
            core.setOutput('run_url', run.html_url);
            await core.summary.addHeading('Full Validation evidence')
              .addRaw(`Commit: ${sha}\n\nRun: ${run.html_url}\n`).write();

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed dist
        run: npm run verify-dist

      - name: Check exact tracked release artifacts and checksums
        id: artifact
        run: |
          for KIND in core editor; do
            ARTIFACT=dist/sensor-bar-card-plus.js
            if [[ "$KIND" == editor ]]; then ARTIFACT=dist/sensor-bar-card-plus-editor.js; fi
            git ls-files --error-unmatch "$ARTIFACT" >/dev/null
            test -s "$ARTIFACT"
            git diff --exit-code "$GITHUB_SHA" -- "$ARTIFACT"
            echo "${KIND}_sha256=$(sha256sum "$ARTIFACT" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            echo "${KIND}_size=$(wc -c < "$ARTIFACT" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - name: Recheck main and release name immediately before tag creation
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const tag = process.env.RELEASE_TAG;
            const { data: main } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            if (main.commit.sha !== sha) {
              throw new Error(`main advanced from ${sha} to ${main.commit.sha}; no release tag was created.`);
            }
            for (const [label, check] of [
              ['tag', () => github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })],
              ['release', () => github.rest.repos.getReleaseByTag({ ...context.repo, tag })],
            ]) {
              try {
                await check();
                throw new Error(`Refusing to reuse existing ${label} for ${tag}.`);
              } catch (error) {
                if (error.message.startsWith('Refusing to reuse existing')) throw error;
                if (error.status !== 404) throw error;
              }
            }

      - name: Create and push annotated release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Sensor Bar Card Plus $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Verify the remote annotated tag target and message
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const ref = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            if (ref.data.object.type !== 'tag') {
              throw new Error(`${tag} is not an annotated tag.`);
            }
            const annotated = await github.rest.git.getTag({
              ...context.repo, tag_sha: ref.data.object.sha,
            });
            if (annotated.data.object.type !== 'commit' ||
                annotated.data.object.sha !== process.env.RELEASE_SHA ||
                annotated.data.message.trim() !== `Sensor Bar Card Plus ${tag}`) {
              throw new Error(`${tag} does not point to the validated commit with the required tag message.`);
            }

      - name: Create empty GitHub draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
        run: |
          RELEASE_ID="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$RELEASE_TAG" \
            -f "target_commitish=$GITHUB_SHA" \
            -f "name=$RELEASE_TITLE" \
            -f body= \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub did not return a valid draft release ID." >&2
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Attach the exact tracked JavaScript pair, editor first
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              throw new Error('The created GitHub Release ID is invalid.');
            }
            for (const name of ['sensor-bar-card-plus-editor.js', 'sensor-bar-card-plus.js']) {
              const data = fs.readFileSync(`dist/${name}`);
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: releaseId, name, data,
                headers: { 'content-type': 'application/javascript', 'content-length': String(data.length) },
              });
              if (asset.name !== name || asset.size !== data.length) {
                throw new Error(`Uploaded asset ${name} does not match the tracked artifact size.`);
              }
            }

      - name: Verify draft state and exact uploaded asset set
        id: draft
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ inputs.title }}
          CORE_SIZE: ${{ steps.artifact.outputs.core_size }}
          EDITOR_SIZE: ${{ steps.artifact.outputs.editor_size }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              throw new Error('The created GitHub Release ID is invalid.');
            }
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getRelease({
              ...context.repo, release_id: releaseId,
            });
            if (!release.draft || release.prerelease || release.name !== process.env.RELEASE_TITLE ||
                release.tag_name !== tag) {
              throw new Error('Release did not remain a draft with the requested title.');
            }
            const expected = [
              ['core', 'sensor-bar-card-plus.js', Number(process.env.CORE_SIZE)],
              ['editor', 'sensor-bar-card-plus-editor.js', Number(process.env.EDITOR_SIZE)],
            ];
            if (release.assets.length !== expected.length) {
              throw new Error('Draft must contain exactly the two intended JavaScript assets; do not publish this incomplete or unexpected draft.');
            }
            for (const [kind, name, size] of expected) {
              const asset = release.assets.find(candidate => candidate.name === name);
              if (!asset || asset.size !== size || asset.state !== 'uploaded') {
                throw new Error(`Expected tracked asset ${name} is missing, incomplete or has the wrong size; do not publish this draft.`);
              }
              core.setOutput(`${kind}_asset_id`, String(asset.id));
            }
            core.setOutput('release_url', release.html_url);

      - name: Verify both downloaded release assets, sizes and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ASSET_ID: ${{ steps.draft.outputs.core_asset_id }}
          EDITOR_ASSET_ID: ${{ steps.draft.outputs.editor_asset_id }}
          CORE_SHA256: ${{ steps.artifact.outputs.core_sha256 }}
          EDITOR_SHA256: ${{ steps.artifact.outputs.editor_sha256 }}
          CORE_SIZE: ${{ steps.artifact.outputs.core_size }}
          EDITOR_SIZE: ${{ steps.artifact.outputs.editor_size }}
        run: |
          DOWNLOAD_DIR="$(mktemp -d)"
          trap 'rm -rf "$DOWNLOAD_DIR"' EXIT
          for KIND in editor core; do
            ASSET_ID="$CORE_ASSET_ID"; EXPECTED_SHA256="$CORE_SHA256"; EXPECTED_SIZE="$CORE_SIZE"
            if [[ "$KIND" == editor ]]; then
              ASSET_ID="$EDITOR_ASSET_ID"; EXPECTED_SHA256="$EDITOR_SHA256"; EXPECTED_SIZE="$EDITOR_SIZE"
            fi
            gh api --header "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$DOWNLOAD_DIR/$KIND.js"
            ACTUAL_SHA256="$(sha256sum "$DOWNLOAD_DIR/$KIND.js" | cut -d ' ' -f 1)"
            ACTUAL_SIZE="$(wc -c < "$DOWNLOAD_DIR/$KIND.js" | tr -d ' ')"
            if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" || "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]]; then
              echo "Uploaded $KIND asset does not match validated tracked bytes; do not publish this draft." >&2
              exit 1
            fi
          done

      - name: Summarize prepared draft release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          VALIDATION_RUN_URL: ${{ steps.validation.outputs.run_url }}
          CORE_SHA256: ${{ steps.artifact.outputs.core_sha256 }}
          EDITOR_SHA256: ${{ steps.artifact.outputs.editor_sha256 }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        run: |
          {
            echo "## Release draft prepared"
            echo "Version: $RELEASE_VERSION"
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $RELEASE_SHA"
            echo "Full Validation run: $VALIDATION_RUN_URL"
            echo "Artifact: dist/sensor-bar-card-plus.js"
            echo "SHA-256: $CORE_SHA256 (downloaded release asset verified)"
            echo "Artifact: dist/sensor-bar-card-plus-editor.js"
            echo "SHA-256: $EDITOR_SHA256 (downloaded release asset verified)"
            echo "Draft GitHub Release: $RELEASE_URL"
            echo "Status: DRAFT. Add and review notes from private/WHATS-NEW.md, then publish manually."
          } >> "$GITHUB_STEP_SUMMARY"
